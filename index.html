<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수입·예산 관리</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <!-- iOS PWA 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="예산관리">
  <link rel="apple-touch-icon" href="apple-touch-icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI','Apple SD Gothic Neo',sans-serif; background:#059669; min-height:100vh; color:#1e293b; }
    body.app-ready { background:#f0f4f8; }

    header { background:linear-gradient(135deg,#065f46,#059669); color:white; padding:18px 28px; box-shadow:0 4px 12px rgba(6,95,70,.25); }
    header h1 { font-size:1.25rem; font-weight:700; }
    header p  { font-size:.8rem; opacity:.75; margin-top:2px; }

    .app-layout { display:flex; gap:20px; padding:24px; max-width:1300px; margin:0 auto; align-items:flex-start; }
    .left-panel  { width:360px; flex-shrink:0; display:flex; flex-direction:column; gap:14px; }
    .right-panel { flex:1; min-width:0; }

    .card { background:white; border-radius:14px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .card-label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:#94a3b8; margin-bottom:10px; }

    /* ── mode tabs (4개) ── */
    .mode-tabs { display:flex; background:white; border-radius:14px; padding:6px; box-shadow:0 2px 8px rgba(0,0,0,.06); gap:4px; }
    .mode-tab { flex:1; padding:9px 4px; border:none; border-radius:10px; background:transparent; cursor:pointer; font-size:.75rem; font-weight:600; color:#94a3b8; transition:all .2s; }
    .mode-tab.ia { background:#059669; color:white; box-shadow:0 2px 8px rgba(5,150,105,.3); }
    .mode-tab.ba { background:#1e40af; color:white; box-shadow:0 2px 8px rgba(30,64,175,.3); }
    .mode-tab.ea { background:#7c3aed; color:white; box-shadow:0 2px 8px rgba(124,58,237,.3); }
    .mode-tab.sa { background:#0f766e; color:white; box-shadow:0 2px 8px rgba(15,118,110,.3); }

    /* ── stats view ── */
    .stat-table { width:100%; border-collapse:separate; border-spacing:0; }
    .stat-hdr th { background:#f8fafc; font-size:.68rem; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.5px; padding:10px 12px; border-bottom:2px solid #e2e8f0; text-align:right; white-space:nowrap; }
    .stat-hdr th:first-child { text-align:left; }
    .stat-row td { padding:10px 12px; border-bottom:1px solid #f8fafc; font-size:.83rem; vertical-align:middle; text-align:right; }
    .stat-row td:first-child { text-align:left; font-weight:700; color:#1e293b; }
    .stat-row:hover td { background:#fafafa; }
    .stat-row.empty td { color:#cbd5e1; font-size:.8rem; }
    .stat-bar-bg { flex:1; height:5px; background:#e2e8f0; border-radius:3px; overflow:hidden; }
    .stat-bar-fill { height:100%; border-radius:3px; transition:width .4s; }
    .stat-bar-fill.income { background:linear-gradient(90deg,#059669,#34d399); }
    .stat-bar-fill.spent  { background:linear-gradient(90deg,#7c3aed,#a855f7); }
    .stat-bars { display:flex; flex-direction:column; gap:3px; margin-top:5px; }
    .stat-bar-row { display:flex; align-items:center; gap:6px; }
    .stat-bar-lbl { font-size:.6rem; color:#94a3b8; width:22px; text-align:right; flex-shrink:0; }
    .stat-annual { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
    .stat-annual-item { background:#f8fafc; border-radius:10px; padding:10px; text-align:center; }
    .stat-annual-item .sl { font-size:.68rem; color:#64748b; font-weight:600; margin-bottom:4px; }
    .stat-annual-item .sv { font-size:.9rem; font-weight:700; }

    /* period */
    .period-row { display:flex; gap:8px; margin-bottom:0; }
    .period-row select { flex:1; border:2px solid #e2e8f0; border-radius:8px; padding:7px 10px; font-size:.85rem; color:#1e293b; outline:none; background:#f8fafc; cursor:pointer; }
    .period-row select:focus { border-color:#059669; }

    /* income total display (budget/expense mode) */
    .income-total-row { display:flex; justify-content:space-between; align-items:center; margin-top:12px; background:#f0fdf4; border-radius:10px; padding:10px 14px; }
    .income-total-lbl { font-size:.75rem; color:#065f46; font-weight:600; }
    .income-total-val { font-size:.95rem; font-weight:700; color:#059669; }
    .btn-go-income { display:block; margin-top:6px; width:100%; padding:6px; background:none; border:1.5px dashed #a7f3d0; border-radius:8px; color:#059669; font-size:.75rem; font-weight:600; cursor:pointer; text-align:center; transition:all .2s; }
    .btn-go-income:hover { background:#f0fdf4; }

    /* carryover badge */
    .carryover-box { background:#eff6ff; border-radius:10px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
    .carryover-box .cl { font-size:.78rem; color:#1e40af; font-weight:600; }
    .carryover-box .cv { font-size:1rem; font-weight:700; color:#1e40af; }
    .carryover-box.neg .cv { color:#ef4444; }

    /* summary */
    .sum-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .sum-item { background:#f8fafc; border-radius:10px; padding:10px; text-align:center; }
    .sum-item .sl { font-size:.7rem; color:#64748b; font-weight:600; margin-bottom:3px; }
    .sum-item .sv { font-size:.95rem; font-weight:700; }
    .c-blue { color:#1e40af; } .c-red { color:#ef4444; } .c-green { color:#059669; } .c-purple { color:#7c3aed; }

    .prog-wrap { margin-top:12px; }
    .prog-bg { height:8px; background:#e2e8f0; border-radius:99px; overflow:hidden; }
    .prog-fill { height:100%; border-radius:99px; transition:width .4s; }
    .prog-fill.ia { background:linear-gradient(90deg,#059669,#34d399); }
    .prog-fill.b  { background:linear-gradient(90deg,#3b82f6,#6366f1); }
    .prog-fill.e  { background:linear-gradient(90deg,#7c3aed,#a855f7); }
    .prog-fill.ov { background:linear-gradient(90deg,#ef4444,#f97316); }
    .prog-lbl { display:flex; justify-content:space-between; font-size:.7rem; color:#94a3b8; margin-top:3px; }

    /* add form */
    .form-col { display:flex; flex-direction:column; gap:8px; }
    .fg { display:flex; flex-direction:column; gap:4px; }
    .fg label { font-size:.73rem; font-weight:600; color:#475569; }
    .fg input { border:2px solid #e2e8f0; border-radius:10px; padding:0 12px; height:40px; font-size:.9rem; outline:none; color:#1e293b; transition:border-color .2s; }
    .fg input:focus { border-color:#059669; }
    .fg input.bf:focus { border-color:#3b82f6; }
    .fg input.ep:focus { border-color:#7c3aed; }
    .btn-add { height:40px; background:#059669; color:white; border:none; border-radius:10px; cursor:pointer; font-size:.88rem; font-weight:600; transition:background .2s; }
    .btn-add:hover { background:#047857; }
    .btn-add.bf { background:#1e40af; }
    .btn-add.bf:hover { background:#1d3a9e; }
    .btn-add.ep { background:#7c3aed; }
    .btn-add.ep:hover { background:#6d28d9; }

    /* action */
    .act-bar { display:flex; flex-direction:column; gap:8px; }
    .act-row { display:flex; gap:8px; }
    .btn-act { flex:1; height:40px; border:none; border-radius:10px; cursor:pointer; font-size:.84rem; font-weight:600; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:5px; }
    .btn-save  { background:#f1f5f9; color:#475569; }
    .btn-save:hover  { background:#e2e8f0; }
    .btn-rst   { background:#fee2e2; color:#ef4444; }
    .btn-rst:hover   { background:#fecaca; }
    .btn-xl    { background:#14532d; color:white; }
    .btn-xl:hover    { background:#166534; }

    /* right panel */
    .right-panel .card { min-height:calc(100vh - 150px); }
    .list-hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .list-title { font-size:1rem; font-weight:700; }
    .list-cnt { font-size:.75rem; background:#f1f5f9; color:#64748b; padding:3px 10px; border-radius:99px; font-weight:600; }

    /* ── tree items ── */
    .tree-item {
      display:flex; align-items:center; gap:8px;
      padding:11px 14px; background:#f8fafc; border-radius:10px;
      margin-bottom:6px; position:relative; cursor:default;
      transition:background .15s; border:2px solid transparent;
    }
    .tree-item:hover { background:#f1f5f9; }
    .tree-item.dragging { opacity:.35; }
    .tree-item.drop-before { border-top:3px solid #059669; }
    .tree-item.drop-after  { border-bottom:3px solid #059669; }
    .tree-item.drop-on     { border:2px solid #059669; background:#f0fdf4; }
    /* budget DnD colours */
    .tree-item.drop-before.bf { border-top-color:#3b82f6; }
    .tree-item.drop-after.bf  { border-bottom-color:#3b82f6; }
    .tree-item.drop-on.bf     { border-color:#3b82f6; background:#eff6ff; }
    /* unexp DnD colours */
    .tree-item.drop-before.ep { border-top-color:#7c3aed; }
    .tree-item.drop-after.ep  { border-bottom-color:#7c3aed; }
    .tree-item.drop-on.ep     { border-color:#7c3aed; background:#f5f3ff; }

    .drag-handle { cursor:grab; color:#cbd5e1; flex-shrink:0; display:flex; align-items:center; padding:2px; border-radius:4px; }
    .drag-handle:hover { color:#94a3b8; background:#e2e8f0; }
    .drag-handle:active { cursor:grabbing; }

    .item-num { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:700; flex-shrink:0; background:#dbeafe; color:#1e40af; }
    .item-num.ia { background:#d1fae5; color:#065f46; }
    .item-num.ep { background:#ede9fe; color:#7c3aed; }
    .item-num.unexp { background:#fce7f3; color:#db2777; }

    .item-purpose { flex:1; font-weight:500; font-size:.9rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .item-pct { font-size:.7rem; color:#94a3b8; width:36px; text-align:right; flex-shrink:0; }
    .item-amt { font-weight:700; font-size:.88rem; white-space:nowrap; flex-shrink:0; color:#ef4444; }
    .item-amt.ia { color:#059669; }

    .btn-ico { background:none; border:none; cursor:pointer; width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:all .15s; color:#cbd5e1; flex-shrink:0; }
    .btn-ico.edit:hover { background:#dbeafe; color:#1e40af; }
    .btn-ico.del:hover  { background:#fee2e2; color:#ef4444; }

    /* inline edit */
    .tree-item.editing    { background:#f0fdf4; border:2px solid #a7f3d0; padding:9px 12px; }
    .tree-item.editing.bf { background:#eff6ff; border-color:#bfdbfe; }
    .edit-form { display:flex; align-items:center; gap:7px; width:100%; flex-wrap:wrap; }
    .ei { border:2px solid #a7f3d0; border-radius:8px; padding:0 10px; height:32px; font-size:.86rem; outline:none; color:#1e293b; background:white; }
    .ei:focus { border-color:#059669; }
    .ei.bf { border-color:#bfdbfe; }
    .ei.bf:focus { border-color:#3b82f6; }
    .ei.ep { border-color:#ddd6fe; }
    .ei.ep:focus { border-color:#7c3aed; }
    .ei-p { flex:2; min-width:90px; }
    .ei-a { flex:1; min-width:70px; }
    .btn-ok { height:32px; padding:0 10px; background:#059669; color:white; border:none; border-radius:7px; cursor:pointer; font-size:.8rem; font-weight:600; }
    .btn-ok:hover { background:#047857; }
    .btn-ok.bf { background:#1e40af; }
    .btn-ok.bf:hover { background:#1d3a9e; }
    .btn-ok.ep { background:#7c3aed; }
    .btn-ok.ep:hover { background:#6d28d9; }
    .btn-cx { height:32px; padding:0 10px; background:#f1f5f9; color:#64748b; border:none; border-radius:7px; cursor:pointer; font-size:.8rem; font-weight:600; }

    /* bracket group */
    .bracket-group { position:relative; }
    .tree-item.has-kids    { background:#eff6ff; }
    .tree-item.has-kids:hover { background:#dbeafe; }
    .tree-item.has-kids-ia { background:#f0fdf4; }
    .tree-item.has-kids-ia:hover { background:#dcfce7; }
    .bracket-sum-row { display:flex; justify-content:flex-end; align-items:center; gap:6px; padding:3px 12px 6px; font-size:.73rem; border-top:1.5px dashed #93c5fd; margin:0 4px 6px; }
    .bracket-sum-row.ia-bsr { border-top-color:#6ee7b7; }
    .bsr-label { color:#93c5fd; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
    .bsr-label.ia { color:#6ee7b7; }
    .bsr-val { font-weight:700; color:#1e40af; font-size:.8rem; }
    .bsr-val.ia { color:#059669; }

    /* ── expense mode table ── */
    .exp-table { width:100%; }
    .exp-row { display:grid; grid-template-columns:28px 1fr 110px 130px 100px; gap:8px; align-items:center; padding:9px 6px; border-bottom:1px solid #f1f5f9; }
    .exp-row:last-child { border-bottom:none; }
    .exp-hdr { font-size:.68rem; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:.5px; padding:4px 6px 10px; border-bottom:2px solid #e2e8f0 !important; }
    .exp-item { transition:background .15s; border-radius:6px; }
    .exp-item:hover { background:#fafafa; }
    .exp-item.unexp-row { background:#fdf4ff; }
    .exp-item.unexp-row:hover { background:#fae8ff; }
    .exp-item.dragging { opacity:.35; }
    .exp-item.drop-before { border-top:2px solid #7c3aed; }
    .exp-item.drop-after  { border-bottom:2px solid #7c3aed; }
    .exp-item.drop-on     { outline:2px solid #7c3aed; background:#f5f3ff; }

    .exp-bamt { font-size:.85rem; color:#1e40af; font-weight:600; text-align:right; }
    .exp-input { width:100%; border:2px solid #e2e8f0; border-radius:7px; padding:0 8px; height:32px; font-size:.85rem; font-weight:600; outline:none; color:#1e293b; transition:border-color .2s; text-align:right; }
    .exp-input:focus { border-color:#7c3aed; }
    .exp-remain { font-size:.85rem; font-weight:700; color:#10b981; text-align:right; }
    .exp-remain.neg { color:#ef4444; }
    .unexp-badge { font-size:.65rem; background:#fae8ff; color:#9333ea; padding:1px 5px; border-radius:4px; font-weight:700; white-space:nowrap; }
    .exp-name { font-weight:500; font-size:.87rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:5px; }

    .exp-total-row { display:grid; grid-template-columns:28px 1fr 110px 130px 100px; gap:8px; align-items:center; background:#f8fafc; border-radius:10px; padding:12px 6px; margin-top:10px; font-weight:700; }
    .exp-total-lbl { grid-column:1/3; font-size:.82rem; color:#475569; }
    .exp-tbamt { font-size:.85rem; color:#1e40af; text-align:right; }
    .exp-tact  { font-size:.85rem; color:#ef4444; text-align:right; }
    .exp-trem  { font-size:.85rem; font-weight:700; text-align:right; }
    .exp-trem.neg { color:#ef4444; }

    .exp-final { display:flex; justify-content:space-between; align-items:center; background:#f5f3ff; border-radius:10px; padding:14px 16px; margin-top:8px; }
    .exp-final-lbl { font-size:.85rem; font-weight:700; color:#6d28d9; }
    .exp-final-amt { font-size:1.15rem; font-weight:700; color:#7c3aed; }
    .exp-final-amt.neg { color:#ef4444; }

    .exp-co-row { display:flex; justify-content:space-between; align-items:center; background:#eff6ff; border-radius:10px; padding:10px 16px; margin-top:8px; }
    .exp-co-lbl { font-size:.78rem; font-weight:600; color:#1e40af; }
    .exp-co-amt { font-size:.9rem; font-weight:700; color:#1e40af; }

    /* empty */
    .empty { text-align:center; color:#cbd5e1; padding:60px 0; font-size:.9rem; }
    .empty svg { display:block; margin:0 auto 10px; opacity:.3; }

    /* toast */
    .toast { position:fixed; bottom:24px; right:24px; background:#1e293b; color:white; padding:11px 18px; border-radius:10px; font-size:.85rem; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.18); transform:translateY(60px); opacity:0; transition:transform .25s,opacity .25s; z-index:1000; }
    .toast.show { transform:translateY(0); opacity:1; }
    /* sync badge */
    #syncStatus { font-size:.72rem; font-weight:600; padding:4px 12px; border-radius:99px; transition:background .3s,color .3s; white-space:nowrap; }

    @media(max-width:860px){
      .app-layout{flex-direction:column;padding:16px;}
      .left-panel{width:100%;}
      .right-panel .card{min-height:auto;}
      .exp-row,.exp-total-row{grid-template-columns:24px 1fr 88px 100px 80px;}
    }
    @media(max-width:620px){
      .exp-row,.exp-total-row{grid-template-columns:20px 1fr 96px 78px;gap:5px;align-items:start;}
      .exp-col-budget{display:none;}
      .exp-name{white-space:normal;word-break:break-word;line-height:1.35;padding:2px 0;}
      .exp-hdr{font-size:.62rem;}
      .exp-bamt,.exp-remain,.exp-tact,.exp-trem,.exp-tbamt{font-size:.78rem;}
      .exp-input{height:28px;font-size:.78rem;padding:0 5px;}
      .exp-row{padding:7px 4px;}
    }
  </style>
</head>
<body>

<header style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
  <div>
    <h1>수입·예산 관리</h1>
    <p>수입 계획 · 예산안 · 계층 구조 · 이월 · 실제 지출 비교</p>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div id="userInfo" style="display:flex;align-items:center;gap:8px"></div>
    <div id="syncStatus" style="background:#fef9c3;color:#92400e">⏳ 연결 중...</div>
  </div>
</header>

<!-- 로그인 오버레이 -->
<div id="loginOverlay" style="position:fixed;inset:0;background:linear-gradient(135deg,#065f46,#059669);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:20px;padding:20px">
  <div style="text-align:center;color:white">
    <div style="font-size:3.5rem;margin-bottom:12px">💰</div>
    <h1 style="font-size:1.6rem;font-weight:700;margin-bottom:8px">수입·예산 관리</h1>
    <p style="opacity:.8;font-size:.9rem;line-height:1.6">내 재정을 스마트하게 관리하고<br>모든 기기에서 동기화하세요</p>
  </div>
  <button id="loginBtn" onclick="signInWithGoogle()" style="display:flex;align-items:center;gap:12px;background:white;border:none;padding:14px 28px;border-radius:14px;cursor:pointer;font-size:.95rem;font-weight:600;color:#1e293b;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .15s" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Google 계정으로 로그인
  </button>
  <div id="loginError" style="display:none;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:12px 18px;max-width:320px;text-align:center">

<script>
// ═══════════════════════════════════════
//  FIREBASE
// ═══════════════════════════════════════
firebase.initializeApp(window.FIREBASE_CONFIG);
const _db   = firebase.database();
const _auth = firebase.auth();
let _currentUser = null;
let _fbUnsub = null;

// Firebase 데이터 경로 (로그인한 사용자 UID 기반으로 분리)
function fbRef(key){ return _db.ref(`budgetApp/${_currentUser.uid}/${key}`); }

const _googleSvg=`<svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>`;

function showLoginError(msg){
  const box=document.getElementById('loginError');
  const txt=document.getElementById('loginErrorMsg');
  if(box&&txt){ box.style.display='block'; txt.textContent=msg; }
}
function resetLoginBtn(){
  const btn=document.getElementById('loginBtn');
  if(btn){ btn.innerHTML=_googleSvg+' Google 계정으로 로그인'; btn.disabled=false; }
}

function signInWithGoogle(){
  const btn=document.getElementById('loginBtn');
  if(btn){ btn.innerHTML='⏳ 로그인 중...'; btn.disabled=true; }
  const provider=new firebase.auth.GoogleAuthProvider();
  // 팝업 우선 시도 → 팝업이 차단된 경우에만 리다이렉트 방식으로 전환
  _auth.signInWithPopup(provider)
    .catch(err=>{
      if(err.code==='auth/popup-blocked'||err.code==='auth/popup-closed-by-user'||err.code==='auth/cancelled-popup-request'){
        return _auth.signInWithRedirect(provider);
      }
      showLoginError(err.code+': '+err.message);
      resetLoginBtn();
    });
}
function signOutUser(){
  if(!confirm('로그아웃 하시겠습니까?'))return;
  if(_fbUnsub){_fbUnsub();_fbUnsub=null;}
  _auth.signOut();
}

// 리다이렉트 방식으로 돌아온 경우 명시적으로 처리
_auth.getRedirectResult().then(result=>{
  if(result&&result.user){
    // onAuthStateChanged가 트리거 안 된 경우를 대비한 명시적 처리
    document.getElementById('loginOverlay').style.display='none';
  }
  resetLoginBtn();
}).catch(err=>{
  if(err.code&&err.code!=='auth/no-current-user'){
    showLoginError(err.code+': '+err.message);
  }
  resetLoginBtn();
});

_auth.onAuthStateChanged(user=>{
  _currentUser=user;
  const overlay=document.getElementById('loginOverlay');
  const ui=document.getElementById('userInfo');
  if(user){
    overlay.style.display='none';
    document.body.classList.add('app-ready');
    ui.innerHTML=`
      ${user.photoURL?`<img src="${user.photoURL}" style="width:26px;height:26px;border-radius:50%;object-fit:cover">`:'' }
      <span style="font-size:.73rem;opacity:.85;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${user.displayName||user.email}</span>
      <button onclick="signOutUser()" style="font-size:.68rem;background:rgba(255,255,255,.2);border:none;color:white;padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap">로그아웃</button>`;
    loadData();
  } else {
    overlay.style.display='flex';
    document.body.classList.remove('app-ready');
    ui.innerHTML='';
    incomeItems=[]; budgetItems=[]; expenseAmounts={}; unexpectedExpenses=[];
  }
});

function setSyncStatus(s){
  const el = document.getElementById('syncStatus'); if(!el) return;
  const map = {
    synced:  ['☁️ 동기화됨',   '#d1fae5','#065f46'],
    saving:  ['⏳ 저장 중...',  '#fef9c3','#92400e'],
    loading: ['🔄 불러오는 중','#eff6ff','#1e40af'],
    offline: ['📴 오프라인',    '#fee2e2','#991b1b'],
    updated: ['📱 업데이트됨',  '#ede9fe','#5b21b6'],
  };
  const [text,bg,col] = map[s] || map.offline;
  el.textContent=text; el.style.background=bg; el.style.color=col;
}

function applyData(d){
  // Firebase는 null 필드를 저장 시 삭제하므로, 로드 시 parentId undefined → null 로 정규화
  const fixNull = arr => (arr||[]).map(i=>({...i, parentId: i.parentId ?? null}));
  incomeItems        = fixNull(d.incomeItems);
  budgetItems        = fixNull(d.budgetItems);
  unexpectedExpenses = fixNull(d.unexpectedExpenses);
  expenseAmounts     = d.expenseAmounts     || {};
  _salary            = d.salary             || 0;
  if(_salary>0 && incomeItems.length===0){
    incomeItems=[{id:_salary*1000+1,purpose:'월급',amount:_salary,parentId:null,order:0}];
  }
}

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let mode = 'income';
// { id, purpose, amount, parentId:null|id, order }
let incomeItems        = [];
let budgetItems        = [];
let expenseAmounts     = {};  // { budgetItemId: actualSpent }
let unexpectedExpenses = [];
let _salary = 0; // migration용 (구버전 데이터 변환 후 폐기)

let editId   = null;
let editType = null; // 'income' | 'budget' | 'unexp'
let dndId    = null;
let dndType  = null; // 'income' | 'budget' | 'unexp'
let unexpEditId    = null;
let budgetExpEditId = null; // 지출 모드에서 편집 중인 예산 leaf 항목 id

// ═══════════════════════════════════════
//  COMPUTED
// ═══════════════════════════════════════
const totalIncome = () => incomeItems.filter(i=>i.parentId===null).reduce((s,i)=>s+i.amount,0);
const budgetTotal = () => budgetItems.filter(i=>i.parentId===null).reduce((s,i)=>s+i.amount,0);
const actualTotal = () => budgetItems.filter(i=>i.parentId===null).reduce((s,i)=>s+(expenseAmounts[i.id]||0),0);
// 루트 레벨 세부 내역만 합산 (예산 상위항목에 속한 것은 해당 항목 expenseAmounts에 포함)
const unexpTotal  = () => unexpectedExpenses.filter(i=>i.parentId===null).reduce((s,i)=>s+i.amount,0);

function childrenAmtSum(arr, pid){
  return arr.filter(i=>i.parentId===pid).reduce((s,c)=>s+c.amount,0);
}

// 예산 상위항목의 실제지출 = 하위 예산항목 지출 합 + 하위 세부내역 항목 금액 합
function computeParentExpense(pid){
  return budgetItems.filter(i=>i.parentId===pid).reduce((s,c)=>s+(expenseAmounts[c.id]||0),0)
       + unexpectedExpenses.filter(u=>u.parentId===pid).reduce((s,u)=>s+u.amount,0);
}

function getCarryover(){
  const y=+document.getElementById('yearSel').value;
  const m=+document.getElementById('monthSel').value;
  const pm=m===1?12:m-1, py=m===1?y-1:y;
  const raw=localStorage.getItem(`budget_${py}_${pm}`);
  if(!raw) return 0;
  try{
    const d=JSON.parse(raw);
    const bi=d.budgetItems||[], ea=d.expenseAmounts||{}, ue=d.unexpectedExpenses||[];
    const prevIncome=(d.incomeItems||[]).filter(i=>i.parentId===null).reduce((s,i)=>s+i.amount,0)||(d.salary||0);
    const act=bi.filter(i=>i.parentId===null).reduce((s,i)=>s+(ea[i.id]||0),0);
    const unexp=ue.reduce((s,i)=>s+i.amount,0);
    return prevIncome-act-unexp;
  }catch{ return 0; }
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
(function init(){
  buildPeriod();
  // loadData()는 onAuthStateChanged에서 로그인 후 호출됨
  ['purInput','amtInput'].forEach((id,i)=>{
    document.getElementById(id).addEventListener('keydown',e=>{
      if(e.key==='Enter') i===0?document.getElementById('amtInput').focus():addItem();
    });
  });
})();

function buildPeriod(){
  const now=new Date(), ysel=document.getElementById('yearSel'), msel=document.getElementById('monthSel');
  for(let y=now.getFullYear()-3;y<=now.getFullYear()+2;y++){
    const o=document.createElement('option'); o.value=y; o.textContent=y+'년';
    if(y===now.getFullYear()) o.selected=true; ysel.appendChild(o);
  }
  for(let m=1;m<=12;m++){
    const o=document.createElement('option'); o.value=m; o.textContent=m+'월';
    if(m===now.getMonth()+1) o.selected=true; msel.appendChild(o);
  }
  ysel.addEventListener('change',()=>{editId=null;loadData();});
  msel.addEventListener('change',()=>{editId=null;loadData();});
}

function periodKey(){
  return `budget_${document.getElementById('yearSel').value}_${document.getElementById('monthSel').value}`;
}

// ═══════════════════════════════════════
//  SAVE / LOAD
// ═══════════════════════════════════════
function saveData(){
  setSyncStatus('saving');
  const key = periodKey();
  const data = {incomeItems, budgetItems, expenseAmounts, unexpectedExpenses, lastSaved: Date.now()};
  localStorage.setItem(key, JSON.stringify(data));
  fbRef(key).set(data)
    .then(()=>{ setSyncStatus('synced'); toast('저장 · 클라우드 동기화 완료'); })
    .catch(()=>{ setSyncStatus('offline'); toast('저장됨 (오프라인 — 로컬만)'); });
}

function loadData(){
  const key = periodKey();
  setSyncStatus('loading');
  // 1) 로컬스토리지에서 즉시 로드
  const raw = localStorage.getItem(key);
  let localTs = 0;
  if(raw){
    try{ const d=JSON.parse(raw); applyData(d); localTs=d.lastSaved||0; }
    catch{ applyData({}); }
  } else { applyData({}); }
  renderAll();
  // 2) 기존 Firebase 리스너 해제
  if(_fbUnsub){ _fbUnsub(); _fbUnsub=null; }
  // 3) 새 리스너 등록 (첫 fire = 초기값, 이후 = 다른 기기 변경)
  let firstFire = true;
  const ref = fbRef(key);
  const handler = snap => {
    const d = snap.val();
    if(firstFire){
      firstFire = false;
      if(d && (d.lastSaved||0) > localTs){
        applyData(d);
        localStorage.setItem(key, JSON.stringify(d));
        renderAll();
        toast('☁️ 클라우드에서 최신 데이터를 불러왔습니다.');
      }
      setSyncStatus('synced');
      return;
    }
    // 다른 기기에서 저장된 경우 (편집 중이 아닐 때만 반영)
    if(!d) return;
    if(editId||unexpEditId||budgetExpEditId) return;
    applyData(d);
    localStorage.setItem(key, JSON.stringify(d));
    renderAll();
    setSyncStatus('updated');
    toast('📱 다른 기기에서 변경사항이 적용되었습니다.');
    setTimeout(()=>setSyncStatus('synced'), 3000);
  };
  ref.on('value', handler, ()=>setSyncStatus('offline'));
  _fbUnsub = ()=>ref.off('value', handler);
}

// ═══════════════════════════════════════
//  MODE
// ═══════════════════════════════════════
function switchMode(m){ mode=m; editId=null; budgetExpEditId=null; unexpEditId=null; renderAll(); }

// ═══════════════════════════════════════
//  ADD ITEM
// ═══════════════════════════════════════
function addItem(){
  const purpose=document.getElementById('purInput').value.trim();
  const amount=parseFloat(document.getElementById('amtInput').value);
  if(!purpose){toast('목적을 입력해주세요.');return;}
  if(isNaN(amount)||amount<=0){toast('올바른 금액을 입력해주세요.');return;}
  const id=Date.now();
  if(mode==='income'){
    const mo=incomeItems.filter(i=>i.parentId===null).reduce((m,i)=>Math.max(m,i.order),-1);
    incomeItems.push({id,purpose,amount,parentId:null,order:mo+1});
  } else if(mode==='budget'){
    const mo=budgetItems.filter(i=>i.parentId===null).reduce((m,i)=>Math.max(m,i.order),-1);
    budgetItems.push({id,purpose,amount,parentId:null,order:mo+1});
  } else {
    const mo=unexpectedExpenses.filter(i=>i.parentId===null).reduce((m,i)=>Math.max(m,i.order),-1);
    unexpectedExpenses.push({id,purpose,amount,parentId:null,order:mo+1});
  }
  document.getElementById('purInput').value='';
  document.getElementById('amtInput').value='';
  document.getElementById('purInput').focus();
  renderAll();
}

// ═══════════════════════════════════════
//  DELETE
// ═══════════════════════════════════════
function deleteItem(id, type){
  function collectDesc(arr,pid){ return arr.filter(i=>i.parentId===pid).flatMap(i=>[i.id,...collectDesc(arr,i.id)]); }
  if(type==='income'){
    const toRemove=new Set([id,...collectDesc(incomeItems,id)]);
    incomeItems=incomeItems.filter(i=>!toRemove.has(i.id));
  } else if(type==='budget'||type===true){
    const toRemove=new Set([id,...collectDesc(budgetItems,id)]);
    budgetItems=budgetItems.filter(i=>!toRemove.has(i.id));
    toRemove.forEach(rid=>delete expenseAmounts[rid]);
    unexpectedExpenses.forEach(u=>{ if(toRemove.has(u.parentId)) u.parentId=null; });
  } else {
    function collectUDesc(pid){ return unexpectedExpenses.filter(i=>i.parentId===pid).flatMap(i=>[i.id,...collectUDesc(i.id)]); }
    const item=unexpectedExpenses.find(i=>i.id===id);
    const parentBudgetId=item?.parentId||null;
    const toRemove=new Set([id,...collectUDesc(id)]);
    unexpectedExpenses=unexpectedExpenses.filter(i=>!toRemove.has(i.id));
    // 상위 예산 항목 실제 지출 재계산
    if(parentBudgetId!==null){
      let pid=parentBudgetId;
      while(pid!==null&&pid!==undefined){
        const par=budgetItems.find(i=>i.id===pid); if(!par) break;
        expenseAmounts[pid]=computeParentExpense(pid);
        pid=par.parentId;
      }
    }
  }
  if(editId===id) editId=null;
  renderAll();
}

// ═══════════════════════════════════════
//  INLINE EDIT
// ═══════════════════════════════════════
function startEdit(id,type){
  editId=id; editType=type; renderList();
  requestAnimationFrame(()=>{ const el=document.getElementById(`ep-${id}`); if(el)el.focus(); });
}

function saveEdit(id){
  const p=document.getElementById(`ep-${id}`).value.trim();
  const a=parseFloat(document.getElementById(`ea-${id}`).value);
  if(!p){toast('목적을 입력해주세요.');return;}
  if(isNaN(a)||a<=0){toast('올바른 금액을 입력해주세요.');return;}
  const arr=editType==='income'?incomeItems:editType==='budget'?budgetItems:unexpectedExpenses;
  const item=arr.find(i=>i.id===id);
  if(item){item.purpose=p; item.amount=a;}
  editId=null; renderAll(); toast('수정되었습니다.');
}
function cancelEdit(){ editId=null; renderList(); }

// ═══════════════════════════════════════
//  EXPENSE INPUT
// ═══════════════════════════════════════
function updateExpRemain(id){
  const item=budgetItems.find(i=>i.id===id); if(!item) return;
  const r=item.amount-(expenseAmounts[id]||0);
  const el=document.getElementById(`er-${id}`);
  if(el){el.textContent=fw(r); el.className='exp-remain'+(r<0?' neg':'');}
}

function updateExpense(id,val){
  const v=parseFloat(val); expenseAmounts[id]=(isNaN(v)||v<0)?0:v;
  updateExpRemain(id);
  const item=budgetItems.find(i=>i.id===id);
  if(item){
    let pid=item.parentId;
    while(pid!==null&&pid!==undefined){
      const par=budgetItems.find(i=>i.id===pid); if(!par) break;
      expenseAmounts[pid]=computeParentExpense(pid);
      const inp=document.getElementById(`exp-inp-${pid}`);
      if(inp){ if(inp.tagName==='INPUT') inp.value=expenseAmounts[pid]||''; else inp.textContent=fw(expenseAmounts[pid]||0); }
      updateExpRemain(pid);
      pid=par.parentId;
    }
  }
  refreshExpTotals(); renderSummary();
}

function refreshExpTotals(){
  const co=getCarryover(), tA=actualTotal(), tU=unexpTotal(), tAU=tA+tU, tB=budgetTotal();
  const finalR=totalIncome()+co-tAU;
  const elA=document.getElementById('etA'), elF=document.getElementById('efA');
  if(elA) elA.textContent=fw(tAU);

// ═══════════════════════════════════════
//  DRAG & DROP
// ═══════════════════════════════════════
function onDragStart(e,id,type){
  dndId=id; dndType=type;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>e.currentTarget.classList.add('dragging'),0);
}
function onDragEnd(e){ e.currentTarget.classList.remove('dragging'); clearDrop(); dndId=null; dndType=null; }
function clearDrop(){ document.querySelectorAll('.drop-before,.drop-after,.drop-on').forEach(el=>el.classList.remove('drop-before','drop-after','drop-on')); }

function onDragOver(e,targetId,targetType){
  e.preventDefault(); if(dndId===targetId) return;
  clearDrop();
  const rect=e.currentTarget.getBoundingClientRect(), pct=(e.clientY-rect.top)/rect.height;
  const cls=pct<0.28?'drop-before':pct>0.72?'drop-after':'drop-on';
  e.currentTarget.classList.add(cls);
  if(targetType==='budget') e.currentTarget.classList.add('bf');
  else if(targetType==='unexp') e.currentTarget.classList.add('ep');
}

function onDrop(e,targetId,targetType){
  e.preventDefault(); clearDrop();
  if(!dndId||dndId===targetId) return;
  const rect=e.currentTarget.getBoundingClientRect(), pct=(e.clientY-rect.top)/rect.height;
  let pos=pct<0.28?'before':pct>0.72?'after':'on';
  // 세부 내역 항목은 자식을 가질 수 없으므로 drop-on 불가 → after로 전환
  if(pos==='on' && targetType==='unexp') pos='after';
  performMove(dndId,dndType,targetId,targetType,pos);
  dndId=null; dndType=null; renderAll();
}

function getArr(type){ return type==='income'?incomeItems:type==='budget'?budgetItems:unexpectedExpenses; }

function performMove(dragId,dragType,targetId,targetType,pos){
  // income ↔ income 또는 budget/unexp ↔ budget/unexp만 허용
  const sameGroup=(dragType==='income'&&targetType==='income')||(dragType!=='income'&&targetType!=='income');
  if(!sameGroup) return;

  const dragArr=getArr(dragType), targetArr=getArr(targetType);
  const drag=dragArr.find(i=>i.id===dragId), target=targetArr.find(i=>i.id===targetId);
  if(!drag||!target) return;

  // 자신의 하위로 drop 방지
  if(dragType===targetType && dragType!=='unexp'){
    function isDesc(pid){ return dragArr.some(i=>i.parentId===pid&&(i.id===targetId||isDesc(i.id))); }
    if(isDesc(dragId)) return;
  }

  const allArr=[...incomeItems,...budgetItems,...unexpectedExpenses];
  if(pos==='on'){
    const oldParent=drag.parentId;
    drag.parentId=targetId;
    drag.order=allArr.filter(i=>i.parentId===targetId&&i.id!==dragId).length;
    reorderSiblings(dragArr,oldParent,dragId);
  } else {
    const oldParent=drag.parentId;
    drag.parentId=target.parentId;
    const sibs=allArr.filter(i=>i.parentId===target.parentId&&i.id!==dragId).sort((a,b)=>a.order-b.order);
    const ti=sibs.findIndex(i=>i.id===targetId);
    if(ti===-1){drag.order=0;return;}
    sibs.splice(pos==='before'?ti:ti+1,0,drag);
    sibs.forEach((it,idx)=>it.order=idx);
    if(oldParent!==target.parentId) reorderSiblings(dragArr,oldParent,dragId);
  }
}

function reorderSiblings(arr,parentId,excludeId){
  const allArr=[...incomeItems,...budgetItems,...unexpectedExpenses];
  allArr.filter(i=>i.parentId===parentId&&i.id!==excludeId).sort((a,b)=>a.order-b.order).forEach((it,idx)=>it.order=idx);
}

function renderSummary(){

  let items, pctUsed=0, over=false;

  if(is){

      try{
        const d=JSON.parse(raw);
        aIncome+=(d.incomeItems||[]).filter(i=>i.parentId===null).reduce((s,i)=>s+i.amount,0)||(d.salary||0);
        aSpent+=(d.budgetItems||[]).filter(i=>i.parentId===null).reduce((s,i)=>s+((d.expenseAmounts||{})[i.id]||0),0);
        aSpent+=(d.unexpectedExpenses||[]).filter(i=>i.parentId===null).reduce((s,i)=>s+i.amount,0);

    items=[
      {l:co!==0?'총 수입+이월':'총 수입', v:avail,  c:'c-green'},
      {l:'실제 지출',   v:tA,     c:'c-red'},

// ── 공통 트리 렌더러 ──
function makeTreeRenderer(arr, total, type, amtPrefix, amtClass){
  const isIA=type==='income', isBF=type==='budget';
  const editCls=isIA?'':isBF?' bf':' ep';
  const okCls=isIA?'':isBF?' bf':' ep';
  const numCls=isIA?' ia':isBF?'':' ep';
  const kidCls=isIA?'has-kids-ia':'has-kids';
  const bsrCls=isIA?' ia-bsr':'';
  const bsrLblCls=isIA?' ia':'';
  const bsrValCls=isIA?' ia':'';

  function renderItem(item, depth, sibIdx){
    const myNum=sibIdx+1;
    const children=arr.filter(i=>i.parentId===item.id).sort((a,b)=>a.order-b.order);
    const hasKids=children.length>0;
    const pct=total>0?((item.amount/total)*100).toFixed(1):'0.0';
    const indent=depth*24;
    let html='';
    if(item.id===editId){
      html+=`<div class="tree-item editing${editCls}" style="padding-left:${indent+12}px">
        <div class="edit-form">
          <input class="ei ei-p${editCls}" id="ep-${item.id}" value="${esc(item.purpose)}"
            onkeydown="if(event.key==='Enter')saveEdit(${item.id});if(event.key==='Escape')cancelEdit()"/>
          <input class="ei ei-a${editCls}" id="ea-${item.id}" type="number" value="${item.amount}"
            onkeydown="if(event.key==='Enter')saveEdit(${item.id});if(event.key==='Escape')cancelEdit()"/>
          <button class="btn-ok${okCls}" onclick="saveEdit(${item.id})">저장</button>
          <button class="btn-cx" onclick="cancelEdit()">취소</button>
        </div>
      </div>`;
    } else {
      html+=`<div class="tree-item${hasKids?' '+kidCls:''}" style="padding-left:${indent+4}px"
        id="ti-${item.id}" draggable="true"
        ondragstart="onDragStart(event,${item.id},'${type}')" ondragend="onDragEnd(event)"
        ondragover="onDragOver(event,${item.id},'${type}')" ondragleave="clearDrop()"
        ondrop="onDrop(event,${item.id},'${type}')">
        <div class="drag-handle">${dragIcon()}</div>
        <div class="item-num${numCls}">${myNum}</div>
        <div class="item-purpose" title="${esc(item.purpose)}">${esc(item.purpose)}</div>
        <div class="item-pct">${pct}%</div>
        <div class="item-amt${amtClass}">${amtPrefix}${fw(item.amount)}</div>
        <div style="display:flex;gap:3px;flex-shrink:0">
          <button class="btn-ico edit" onclick="startEdit(${item.id},'${type}')">${editIcon()}</button>
          <button class="btn-ico del"  onclick="deleteItem(${item.id},'${type}')">${delIcon()}</button>
        </div>
      </div>`;
    }
    if(hasKids){
      const ci=(depth+1)*24+4;
      html+=`<div class="bracket-group">`;
      children.forEach((c,i)=>{ html+=renderItem(c,depth+1,i); });
      html+=`<div class="bracket-sum-row${bsrCls}" style="padding-left:${ci}px">
        <span class="bsr-label${bsrLblCls}">하위 합계</span>
        <span class="bsr-val${bsrValCls}">${amtPrefix}${fw(childrenAmtSum(arr,item.id))}</span>
      </div></div>`;
    }
    return html;
  }
  return renderItem;
}

function flatArr(arr,parentId,depth){
  return arr.filter(i=>i.parentId===parentId).sort((a,b)=>a.order-b.order)
    .flatMap(item=>[{item,depth},...flatArr(arr,item.id,depth+1)]);
}

// ═══════════════════════════════════════
//  EXPENSE MODE
// ═══════════════════════════════════════
function initParentExpenses(){
  function depth(id,d=0){ const it=budgetItems.find(i=>i.id===id); return it?.parentId?depth(it.parentId,d+1):d; }
  // 예산 하위 또는 세부 내역 하위가 있는 항목 모두 처리
  budgetItems.filter(item=>
    budgetItems.some(i=>i.parentId===item.id) || unexpectedExpenses.some(u=>u.parentId===item.id)
  )
    .sort((a,b)=>depth(b.id)-depth(a.id))
    .forEach(item=>{
      expenseAmounts[item.id]=computeParentExpense(item.id);
    });
}

function renderExpenseList(){
  const list=document.getElementById('itemList');
  if(budgetItems.length===0&&unexpectedExpenses.length===0){
    list.innerHTML=emptyHtml('예산안 모드에서 예산 항목을 추가하거나,<br>예상치 못한 지출을 추가해주세요.'); return;
  }
  initParentExpenses();
  const co=getCarryover(), ti=totalIncome(), tB=budgetTotal(), tA=actualTotal(), tU=unexpTotal(), tAU=tA+tU;
  const finalR=ti+co-tAU;
  const rows=buildExpenseRows(null,0);
  list.innerHTML=`
    <div class="exp-table">
      <div class="exp-row exp-hdr">
        <span>#</span><span>항목</span>
        <span class="exp-col-budget" style="text-align:right">예산</span>
        <span style="text-align:right">실제 지출</span>
        <span style="text-align:right">잔액</span>
      </div>
      ${rows.map(r=>renderExpRow(r)).join('')}
      <div class="exp-total-row">
        <div class="exp-total-lbl">합계</div>
        <div class="exp-tbamt exp-col-budget" id="etB">${fw(tB)}</div>
        <div class="exp-tact" id="etA">${fw(tAU)}</div>
        <div class="exp-trem${tB-tAU<0?' neg':''}" id="etR">${fw(tB-tAU)}</div>
      </div>
    </div>
    ${co!==0?`<div class="exp-co-row"><span class="exp-co-lbl">전월 이월</span><span class="exp-co-amt">${fw(co)}</span></div>`:''}
    <div class="exp-final">
      <span class="exp-final-lbl">최종 잔액 (총 수입+이월 − 실제지출 − 예상외)</span>
      <span class="exp-final-amt${finalR<0?' neg':''}" id="efA">${fw(finalR)}</span>
    </div>`;
}

function buildExpenseRows(parentId,depth){
  const result=[];
  budgetItems.filter(i=>i.parentId===parentId).sort((a,b)=>a.order-b.order).forEach((item,bi)=>{
    result.push({type:'budget',item,depth,sibIdx:bi});
    unexpectedExpenses.filter(u=>u.parentId===item.id).sort((a,b)=>a.order-b.order).forEach((u,ui)=>{
      result.push({type:'unexp',item:u,depth:depth+1,sibIdx:ui});
    });
    result.push(...buildExpenseRows(item.id,depth+1));
  });
  if(parentId===null){
    unexpectedExpenses.filter(u=>u.parentId===null).sort((a,b)=>a.order-b.order).forEach((u,ui)=>{
      result.push({type:'unexp',item:u,depth:0,sibIdx:ui});
    });
  }
  return result;
}

function renderExpRow({type,item,depth,sibIdx}){
  const indent=depth*22;
  const num=sibIdx+1;
  if(type==='budget'){
    const hasKids=budgetItems.some(i=>i.parentId===item.id)||unexpectedExpenses.some(u=>u.parentId===item.id);
    const actual=expenseAmounts[item.id]||0, remain=item.amount-actual;
    const isLeafEditing=(!hasKids)&&(item.id===budgetExpEditId);
    // 실제 지출 셀: 상위(hasKids) 또는 leaf 비편집 → 텍스트, leaf 편집 → input
    const expCell = (hasKids||!isLeafEditing)
      ? `<div id="exp-inp-${item.id}" style="font-size:.85rem;font-weight:700;color:${actual>0?'#ef4444':'#94a3b8'};text-align:right;">${fw(actual)}</div>`
      : `<input class="exp-input" type="number" id="exp-inp-${item.id}" value="${actual||''}" placeholder="0" min="0" step="1000"
          oninput="updateExpense(${item.id},this.value)"
          onkeydown="if(event.key==='Enter'||event.key==='Escape')endBudgetExp()"/>`;
    // 잔액 셀: leaf 편집 중이면 체크 버튼 + 잔액, 아니면 잔액 + (leaf이면 연필 버튼)
    const remainCell = hasKids
      ? `<div class="exp-remain${remain<0?' neg':''}" id="er-${item.id}">${fw(remain)}</div>`
      : isLeafEditing
        ? `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end">
             <button class="btn-ico edit" onclick="endBudgetExp()" title="확인">${checkIcon()}</button>
             <div class="exp-remain${remain<0?' neg':''}" id="er-${item.id}">${fw(remain)}</div>
           </div>`
        : `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end">
             <button class="btn-ico edit" onclick="startBudgetExp(${item.id})" title="수정">${editIcon()}</button>
             <div class="exp-remain${remain<0?' neg':''}" id="er-${item.id}">${fw(remain)}</div>
           </div>`;
    return `<div class="exp-row exp-item" style="padding-left:${indent+2}px;${hasKids?'background:#f8fafc;':''}"
      draggable="true"
      ondragstart="onDragStart(event,${item.id},'budget')" ondragend="onDragEnd(event)"
      ondragover="onDragOver(event,${item.id},'budget')" ondragleave="clearDrop()"
      ondrop="onDrop(event,${item.id},'budget')">
      <div class="item-num">${num}</div>
      <div class="exp-name" style="${hasKids?'font-weight:700;':''}">${esc(item.purpose)}</div>
      <div class="exp-bamt exp-col-budget">${fw(item.amount)}</div>
      ${expCell}
      ${remainCell}
    </div>`;
  } else {
    const isEditing = item.id === unexpEditId;
    const expCell = isEditing
      ? `<input class="exp-input" type="number" id="unexp-inp-${item.id}" value="${item.amount||''}" placeholder="0" min="0" step="1000"
          style="border-color:#ddd6fe;" onkeydown="if(event.key==='Enter')saveUnexp(${item.id});else if(event.key==='Escape'){unexpEditId=null;renderList();}"/>`
      : `<div class="exp-bamt" style="color:#9333ea;text-align:right">${fw(item.amount)}</div>`;
    const btnCell = isEditing
      ? `<button class="btn-ico edit" onclick="saveUnexp(${item.id})" title="확인">${checkIcon()}</button>
         <button class="btn-ico del" onclick="deleteItem(${item.id},'unexp')">${delIcon()}</button>`
      : `<button class="btn-ico edit" onclick="startUnexpEdit(${item.id})" title="수정">${editIcon()}</button>
         <button class="btn-ico del" onclick="deleteItem(${item.id},'unexp')">${delIcon()}</button>`;
    return `<div class="exp-row exp-item unexp-row" style="padding-left:${indent+2}px"
      draggable="true"
      ondragstart="onDragStart(event,${item.id},'unexp')" ondragend="onDragEnd(event)"
      ondragover="onDragOver(event,${item.id},'unexp')" ondragleave="clearDrop()"
      ondrop="onDrop(event,${item.id},'unexp')">
      <div class="item-num unexp">${num}</div>
      <div class="exp-name">${esc(item.purpose)}</div>
      <div class="exp-bamt exp-col-budget" style="color:#cbd5e1">—</div>
      ${expCell}

}

function startBudgetExp(id){ budgetExpEditId=id; renderList(); requestAnimationFrame(()=>document.getElementById(`exp-inp-${id}`)?.focus()); }
function endBudgetExp(){ budgetExpEditId=null; renderList(); }

function startUnexpEdit(id){
  unexpEditId=id; renderList();
  requestAnimationFrame(()=>document.getElementById(`unexp-inp-${id}`)?.focus());
}

function saveUnexp(id){
  const inp=document.getElementById(`unexp-inp-${id}`);
  const v=parseFloat(inp.value);
  if(isNaN(v)||v<=0){toast('올바른 금액을 입력해주세요.');return;}
  const item=unexpectedExpenses.find(i=>i.id===id);
  if(item){
    item.amount=v;
    // 상위 예산 항목 실제 지출 재계산
    let pid=item.parentId;
    while(pid!==null&&pid!==undefined){
      const par=budgetItems.find(i=>i.id===pid); if(!par) break;
      expenseAmounts[pid]=computeParentExpense(pid);
      pid=par.parentId;
    }
  }
  unexpEditId=null;
  renderAll(); toast('수정되었습니다.');
}

function renderStatsView(){
  const list=document.getElementById('itemList');
  const yr=document.getElementById('yearSel').value;
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const rows=[];
  let maxVal=1;
  for(let m=1;m<=12;m++){
    const raw=localStorage.getItem(`budget_${yr}_${m}`);
    if(!raw){rows.push({m,empty:true});continue;}
    try{
      const d=JSON.parse(raw);
      const income=(d.incomeItems||[]).filter(i=>i.parentId===null).reduce((s,i)=>s+i.amount,0)||(d.salary||0);
      const spent=(d.budgetItems||[]).filter(i=>i.parentId===null).reduce((s,i)=>s+((d.expenseAmounts||{})[i.id]||0),0)
                 +(d.unexpectedExpenses||[]).filter(i=>i.parentId===null).reduce((s,i)=>s+i.amount,0);
      maxVal=Math.max(maxVal,income,spent);
      rows.push({m,income,spent,remain:income-spent,empty:false});
    }catch{rows.push({m,empty:true});}
  }
  const hasAny=rows.some(r=>!r.empty);
  if(!hasAny){list.innerHTML=emptyHtml('아직 저장된 데이터가 없습니다.');return;}

  list.innerHTML=`
    <table class="stat-table">
      <thead class="stat-hdr"><tr>
        <th style="text-align:left">월</th>
        <th>수입</th><th>지출</th><th>잔액</th><th style="min-width:120px">현황</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>{
          if(r.empty) return `<tr class="stat-row empty"><td>${months[r.m-1]}</td><td colspan="4" style="text-align:center">—</td></tr>`;
          const pct=r.income>0?Math.min(r.spent/r.income*100,100):0;
          const iW=(r.income/maxVal*100).toFixed(1), sW=(r.spent/maxVal*100).toFixed(1);
          return `<tr class="stat-row">
            <td>${months[r.m-1]}</td>
            <td class="c-green">${fw(r.income)}</td>
            <td class="c-red">${fw(r.spent)}</td>
            <td class="${r.remain<0?'c-red':'c-blue'}">${fw(r.remain)}</td>
            <td>
              <div style="font-size:.7rem;color:#94a3b8;text-align:right;margin-bottom:3px">${pct.toFixed(1)}% 사용</div>
              <div class="stat-bars">
                <div class="stat-bar-row"><span class="stat-bar-lbl">수입</span><div class="stat-bar-bg"><div class="stat-bar-fill income" style="width:${iW}%"></div></div></div>
                <div class="stat-bar-row"><span class="stat-bar-lbl">지출</span><div class="stat-bar-bg"><div class="stat-bar-fill spent" style="width:${sW}%"></div></div></div>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// ─── Excel 스타일 헬퍼 ───────────────────
function xc(v, s={}){ const t=typeof v==='number'?'n':'s'; return {v:v??'',t,s}; }
function xlBdr(){ return {top:{style:'thin',color:{rgb:'CBD5E1'}},bottom:{style:'thin',color:{rgb:'CBD5E1'}},left:{style:'thin',color:{rgb:'CBD5E1'}},right:{style:'thin',color:{rgb:'CBD5E1'}}}; }
function xlHdrStyle(rgb){ return {font:{bold:true,color:{rgb:'FFFFFF'},sz:10},fill:{fgColor:{rgb}},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:{top:{style:'medium',color:{rgb}},bottom:{style:'medium',color:{rgb}},left:{style:'medium',color:{rgb}},right:{style:'medium',color:{rgb}}}}; }
function xlDataStyle(align='left'){ return {alignment:{horizontal:align,vertical:'center'},border:xlBdr()}; }
function xlAmtStyle(neg=false){ return {font:{color:{rgb:neg?'DC2626':'374151'}},alignment:{horizontal:'right',vertical:'center'},border:xlBdr()}; }
function xlTotalStyle(rgb){ return {font:{bold:true,color:{rgb}},fill:{fgColor:{rgb:'F1F5F9'}},alignment:{horizontal:'right',vertical:'center'},border:xlBdr()}; }
function xlSumLbl(){ return {font:{bold:true,color:{rgb:'475569'}},alignment:{horizontal:'left'}}; }
function xlSumVal(rgb){ return {font:{bold:true,color:{rgb}},alignment:{horizontal:'right'}}; }
function xlTitle(){ return {font:{bold:true,sz:13,color:{rgb:'1E293B'}},alignment:{horizontal:'left',vertical:'center'}}; }

function buildItemRows(arr, amtColIdx, extraCols=[]){
  // Returns [row arrays] where depth=0 goes to col1, depth>=1 goes to col2
  const rows=[];
  let cnt=0;
  function walk(parentId, depth){
    arr.filter(i=>i.parentId===parentId).sort((a,b)=>a.order-b.order).forEach(item=>{
      cnt++;
      const isRoot=depth===0;
      const name=('  '.repeat(Math.max(0,depth-1)))+item.purpose;
      const amtCell=xc(item.amount,xlAmtStyle());
      const numCell=xc(cnt,xlDataStyle('center'));
      if(isRoot) rows.push([numCell, xc(item.purpose,xlDataStyle()), xc('',xlDataStyle()), amtCell, ...extraCols.map(fn=>fn(item))]);
      else rows.push([numCell, xc('',xlDataStyle()), xc(name,xlDataStyle()), amtCell, ...extraCols.map(fn=>fn(item))]);
      walk(item.id, depth+1);
    });
  }
  walk(null, 0);
  return rows;
}

function importExcel(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const wsI=wb.Sheets['수입'], wsB=wb.Sheets['예산안'], wsE=wb.Sheets['지출내역'];
      if(!wsI&&!wsB){toast('올바른 파일 형식이 아닙니다.');return;}
      // 연월 추출
      const titleWs=wsI||wsB;
      const titleText=String(titleWs['A1']?.v||'');
      const match=titleText.match(/(\d{4})년\s*(\d{1,2})월/);
      if(!match){toast('파일에서 날짜를 찾을 수 없습니다.');return;}
      const [,yr,mo]=match;
      // 파싱
      const newIncomeItems=wsI?parseXlItemSheet(wsI):[];
      const newBudgetItems=wsB?parseXlItemSheet(wsB):[];
      const {ea,ue}=wsE?parseXlExpenseSheet(wsE,newBudgetItems):{ea:{},ue:[]};
      // 저장
      const importedData={incomeItems:newIncomeItems,budgetItems:newBudgetItems,expenseAmounts:ea,unexpectedExpenses:ue,lastSaved:Date.now()};
      localStorage.setItem(`budget_${yr}_${mo}`,JSON.stringify(importedData));
      // Firebase에도 즉시 저장해서 리스너가 덮어쓰지 않도록
      if(_currentUser) _db.ref(`budgetApp/${_currentUser.uid}/budget_${yr}_${mo}`).set(importedData).catch(()=>{});
      document.getElementById('yearSel').value=yr;
      document.getElementById('monthSel').value=parseInt(mo);
      editId=null; unexpEditId=null; loadData();
      toast(`${yr}년 ${mo}월 데이터를 불러왔습니다.`);
    }catch(err){console.error(err);toast('파일 읽기 오류가 발생했습니다.');}
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}

function parseXlItemSheet(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let hdr=-1;
  for(let r=0;r<rows.length;r++){if(rows[r].some(c=>String(c).trim()==='항목')){hdr=r;break;}}
  if(hdr===-1) return [];
  const items=[]; let lastRootId=null; let o0=0,o1=0;
  const base=Date.now()+Math.floor(Math.random()*1e5);
  for(let r=hdr+1;r<rows.length;r++){
    const row=rows[r];
    const c1=String(row[1]||'').trim(), c2=String(row[2]||'').trim();
    if(c1==='합계'||c2==='합계') break;
    if(!c1&&!c2) continue;
    const rawAmt=row[3];
    const amt=typeof rawAmt==='number'?rawAmt:(parseFloat(String(rawAmt||'').replace(/[^0-9.-]/g,''))||0);
    const id=base+items.length+1;
    if(c1){items.push({id,purpose:c1,amount:amt,parentId:null,order:o0++});lastRootId=id;o1=0;}
    else if(c2){items.push({id,purpose:c2.replace(/^\s+/,''),amount:amt,parentId:lastRootId,order:o1++});}
  }
  return items;
}

function parseXlExpenseSheet(ws, budgetItems){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let hdr=-1;
  for(let r=0;r<rows.length;r++){if(rows[r].some(c=>String(c).trim()==='항목')){hdr=r;break;}}
  if(hdr===-1) return {ea:{},ue:[]};
  // 예산 항목 이름 → id 맵
  const bMap=new Map(); budgetItems.forEach(i=>bMap.set(String(i.purpose).trim().toLowerCase(),i.id));
  const ea={},ue=[]; let lastRootBid=null; let ueOrd=0;
  const base=Date.now()+Math.floor(Math.random()*1e5)+500;
  for(let r=hdr+1;r<rows.length;r++){
    const row=rows[r];
    const c1=String(row[1]||'').trim(), c2=String(row[2]||'').trim();
    if(c1==='합계'||c2==='합계') break;
    if(!c1&&!c2) continue;
    const budget=row[3], actual=row[4];
    const hasBgt=typeof budget==='number'&&budget>0;
    const actualAmt=typeof actual==='number'?actual:(parseFloat(String(actual||'').replace(/[^0-9.-]/g,''))||0);
    if(c1){
      if(hasBgt){const bid=bMap.get(c1.toLowerCase());if(bid!=null){ea[bid]=actualAmt;lastRootBid=bid;}}
      else{const id=base+ue.length+1;ue.push({id,purpose:c1,amount:actualAmt,parentId:null,order:ueOrd++});lastRootBid=null;}
    }else if(c2){
      const pname=c2.replace(/^\s+/,'');
      if(hasBgt){const bid=bMap.get(pname.toLowerCase());if(bid!=null)ea[bid]=actualAmt;}
      else{const id=base+ue.length+1;ue.push({id,purpose:pname,amount:actualAmt,parentId:lastRootBid,order:ueOrd++});}
    }
  }
  return {ea,ue};
}
