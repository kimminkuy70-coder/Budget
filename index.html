<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예산안 관리</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      color: #1e293b;
    }

    header {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white;
      padding: 18px 28px;
      box-shadow: 0 4px 12px rgba(30,64,175,0.25);
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header p  { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }

    /* ── 레이아웃 ── */
    .app-layout {
      display: flex;
      gap: 20px;
      padding: 24px;
      max-width: 1280px;
      margin: 0 auto;
      align-items: flex-start;
    }
    .left-panel  { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
    .right-panel { flex: 1; min-width: 0; }

    /* ── 카드 ── */
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    /* ── 모드 탭 ── */
    .mode-tabs {
      display: flex;
      background: white;
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      gap: 0;
    }
    .mode-tab {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: #94a3b8;
      transition: all 0.2s;
    }
    .mode-tab.budget-active  { background: #1e40af; color: white; box-shadow: 0 2px 8px rgba(30,64,175,0.3); }
    .mode-tab.expense-active { background: #7c3aed; color: white; box-shadow: 0 2px 8px rgba(124,58,237,0.3); }

    /* ── 기간 선택 ── */
    .period-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .period-row select {
      flex: 1;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.85rem;
      color: #1e293b;
      outline: none;
      background: #f8fafc;
      cursor: pointer;
    }
    .period-row select:focus { border-color: #3b82f6; }

    /* ── 입력 ── */
    .input-wrap {
      display: flex;
      align-items: center;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: #3b82f6; }
    .input-wrap .prefix {
      padding: 0 12px;
      background: #f8fafc;
      color: #64748b;
      height: 44px;
      display: flex;
      align-items: center;
      border-right: 1px solid #e2e8f0;
      font-size: 0.9rem;
    }
    .input-wrap input {
      border: none;
      outline: none;
      padding: 0 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
      height: 44px;
      width: 100%;
      background: transparent;
    }
    .btn-set {
      margin-top: 8px;
      width: 100%;
      height: 40px;
      background: #1e40af;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-set:hover { background: #1d3a9e; }

    /* ── 잔액 현황 ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .summary-item {
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
    }
    .s-label { font-size: 0.72rem; color: #64748b; font-weight: 600; margin-bottom: 4px; }
    .s-amt   { font-size: 1rem; font-weight: 700; }
    .c-blue   { color: #1e40af; }
    .c-red    { color: #ef4444; }
    .c-green  { color: #10b981; }
    .c-purple { color: #7c3aed; }

    .progress-wrap { margin-top: 14px; }
    .progress-bg   { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.4s ease;
    }
    .progress-fill.budget  { background: linear-gradient(90deg, #3b82f6, #6366f1); }
    .progress-fill.expense { background: linear-gradient(90deg, #7c3aed, #a855f7); }
    .progress-fill.over    { background: linear-gradient(90deg, #ef4444, #f97316); }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.72rem; color: #94a3b8; margin-top: 4px; }

    /* ── 예산안 추가 폼 ── */
    .form-row { display: flex; flex-direction: column; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.75rem; font-weight: 600; color: #475569; }
    .form-group input {
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 0 12px;
      height: 40px;
      font-size: 0.9rem;
      outline: none;
      color: #1e293b;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #3b82f6; }
    .btn-add {
      height: 40px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-add:hover { background: #059669; }

    /* ── 지출 안내 ── */
    .expense-guide {
      background: #f5f3ff;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.82rem;
      color: #6d28d9;
      line-height: 1.5;
    }
    .expense-guide strong { display: block; margin-bottom: 4px; font-size: 0.85rem; }

    /* ── 액션 바 ── */
    .action-bar { display: flex; flex-direction: column; gap: 8px; }
    .action-row { display: flex; gap: 8px; }
    .btn-action {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-save   { background: #f1f5f9; color: #475569; }
    .btn-save:hover  { background: #e2e8f0; }
    .btn-reset  { background: #fee2e2; color: #ef4444; }
    .btn-reset:hover { background: #fecaca; }
    .btn-excel  { background: #14532d; color: white; }
    .btn-excel:hover { background: #166534; }

    /* ── 우측 패널 ── */
    .right-panel .card { min-height: calc(100vh - 140px); }
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .list-title { font-size: 1rem; font-weight: 700; color: #1e293b; }
    .list-count {
      font-size: 0.78rem;
      background: #f1f5f9;
      color: #64748b;
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 600;
    }

    /* ── 예산안 리스트 아이템 ── */
    .budget-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      background: #f8fafc;
      border-radius: 10px;
      margin-bottom: 8px;
      animation: fadeSlide 0.2s ease;
    }
    .budget-item:last-child { margin-bottom: 0; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .item-num {
      width: 24px; height: 24px;
      background: #dbeafe; color: #1e40af;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700;
      flex-shrink: 0;
    }
    .item-purpose { flex: 1; font-weight: 500; font-size: 0.9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-pct     { font-size: 0.72rem; color: #94a3b8; width: 38px; text-align: right; flex-shrink: 0; }
    .item-amount  { font-weight: 700; font-size: 0.9rem; color: #ef4444; white-space: nowrap; flex-shrink: 0; }

    .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .btn-icon {
      background: none; border: none; cursor: pointer;
      width: 28px; height: 28px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      color: #cbd5e1;
    }
    .btn-icon.edit:hover   { background: #dbeafe; color: #1e40af; }
    .btn-icon.delete:hover { background: #fee2e2; color: #ef4444; }

    /* ── 인라인 편집 ── */
    .budget-item.editing {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      padding: 10px 12px;
    }
    .edit-form { display: flex; align-items: center; gap: 8px; width: 100%; flex-wrap: wrap; }
    .edit-input {
      border: 2px solid #bfdbfe;
      border-radius: 8px;
      padding: 0 10px;
      height: 34px;
      font-size: 0.88rem;
      outline: none;
      color: #1e293b;
      background: white;
    }
    .edit-input:focus { border-color: #3b82f6; }
    .edit-purpose { flex: 2; min-width: 100px; }
    .edit-amount  { flex: 1; min-width: 80px; }
    .btn-confirm {
      height: 34px; padding: 0 12px;
      background: #1e40af; color: white;
      border: none; border-radius: 8px;
      cursor: pointer; font-size: 0.82rem; font-weight: 600;
      transition: background 0.2s; white-space: nowrap;
    }
    .btn-confirm:hover { background: #1d3a9e; }
    .btn-cancel {
      height: 34px; padding: 0 12px;
      background: #f1f5f9; color: #64748b;
      border: none; border-radius: 8px;
      cursor: pointer; font-size: 0.82rem; font-weight: 600;
    }
    .btn-cancel:hover { background: #e2e8f0; }

    /* ── 지출 내역 테이블 ── */
    .expense-table { width: 100%; }

    .expense-row {
      display: grid;
      grid-template-columns: 30px 1fr 110px 140px 110px;
      gap: 10px;
      align-items: center;
      padding: 10px 6px;
      border-bottom: 1px solid #f1f5f9;
    }
    .expense-row:last-child { border-bottom: none; }

    .expense-header {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 6px 12px;
      border-bottom: 2px solid #e2e8f0 !important;
    }

    .expense-item { transition: background 0.15s; border-radius: 8px; }
    .expense-item:hover { background: #fafafa; }

    .expense-num {
      width: 24px; height: 24px;
      background: #ede9fe; color: #7c3aed;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700;
      flex-shrink: 0;
    }

    .expense-name {
      font-weight: 500;
      font-size: 0.88rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .expense-budget-amt {
      font-size: 0.88rem;
      color: #1e40af;
      font-weight: 600;
      text-align: right;
    }

    .expense-input {
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 0 10px;
      height: 34px;
      font-size: 0.88rem;
      font-weight: 600;
      outline: none;
      color: #1e293b;
      transition: border-color 0.2s;
      text-align: right;
    }
    .expense-input:focus { border-color: #7c3aed; }

    .expense-remain {
      font-size: 0.88rem;
      font-weight: 700;
      color: #10b981;
      text-align: right;
    }
    .expense-remain.negative { color: #ef4444; }

    /* 합계 행 */
    .expense-total-row {
      display: grid;
      grid-template-columns: 30px 1fr 110px 140px 110px;
      gap: 10px;
      align-items: center;
      background: #f8fafc;
      border-radius: 10px;
      padding: 13px 6px;
      margin-top: 12px;
      border: none !important;
    }
    .expense-total-label {
      grid-column: 1 / 3;
      font-size: 0.82rem;
      font-weight: 700;
      color: #475569;
    }
    .expense-total-budget { font-size: 0.88rem; font-weight: 700; color: #1e40af; text-align: right; }
    .expense-total-actual { font-size: 0.88rem; font-weight: 700; color: #ef4444; text-align: right; }

    /* 최종 잔액 행 */
    .expense-final-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f3ff;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 8px;
      border: none !important;
    }
    .expense-final-label { font-size: 0.85rem; font-weight: 700; color: #6d28d9; }
    .expense-final-amt   { font-size: 1.15rem; font-weight: 700; color: #7c3aed; }
    .expense-final-amt.negative { color: #ef4444; }

    /* 빈 상태 */
    .empty-state {
      text-align: center;
      color: #cbd5e1;
      padding: 60px 0;
      font-size: 0.9rem;
    }
    .empty-state svg { display: block; margin: 0 auto 12px; opacity: 0.3; }

    /* 토스트 */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1e293b; color: white;
      padding: 11px 18px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      transform: translateY(60px); opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 1000;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 860px) {
      .app-layout { flex-direction: column; padding: 16px; }
      .left-panel  { width: 100%; }
      .right-panel .card { min-height: auto; }
      .expense-row,
      .expense-total-row { grid-template-columns: 26px 1fr 90px 110px 90px; }
    }
  </style>
</head>
<body>

<header>
  <h1>예산안 관리</h1>
  <p>월급 기반 예산 계획 · 실제 지출 비교 · Excel 내보내기</p>
</header>

<div class="app-layout">

  <!-- ══ 좌측 패널 ══ -->
  <div class="left-panel">

    <!-- 모드 탭 -->
    <div class="mode-tabs">
      <button class="mode-tab budget-active" id="tab-budget"  onclick="switchMode('budget')">예산안 모드</button>
      <button class="mode-tab"              id="tab-expense" onclick="switchMode('expense')">지출 내역 모드</button>
    </div>

    <!-- 기간 + 입력 -->
    <div class="card">
      <div class="card-label">기간 설정</div>
      <div class="period-row">
        <select id="yearSelect"></select>
        <select id="monthSelect"></select>
      </div>

      <!-- 예산안: 월급 입력 -->
      <div id="salarySection">
        <div class="card-label">월급</div>
        <div class="input-wrap">
          <span class="prefix">₩</span>
          <input type="number" id="salaryInput" placeholder="월급을 입력하세요" min="0" step="10000" />
        </div>
        <button class="btn-set" onclick="setSalary()">설정</button>
      </div>

      <!-- 지출: 안내 -->
      <div id="expenseGuideSection" style="display:none">
        <div class="expense-guide">
          <strong>지출 내역 입력</strong>
          예산안에서 설정한 항목별로 실제 지출 금액을 입력하세요. 잔액이 자동으로 계산됩니다.
        </div>
      </div>
    </div>

    <!-- 잔액 현황 -->
    <div class="card">
      <div class="card-label" id="summaryTitle">예산 현황</div>
      <div class="summary-grid" id="summaryGrid">
        <!-- JS로 채움 -->
      </div>
      <div class="progress-wrap">
        <div class="progress-bg">
          <div class="progress-fill budget" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-label">
          <span>0%</span>
          <span id="progressPct">0% 사용</span>
          <span>100%</span>
        </div>
      </div>
    </div>

    <!-- 예산안 추가 폼 (budget 모드만) -->
    <div class="card" id="addFormCard">
      <div class="card-label">예산 항목 추가</div>
      <div class="form-row">
        <div class="form-group">
          <label>예산 목적</label>
          <input type="text" id="purposeInput" placeholder="예) 식비, 교통비, 저축..." />
        </div>
        <div class="form-group">
          <label>예산 금액 (원)</label>
          <input type="number" id="amountInput" placeholder="0" min="0" step="1000" />
        </div>
        <button class="btn-add" onclick="addBudgetItem()">+ 추가</button>
      </div>
    </div>

    <!-- 액션 버튼 -->
    <div class="action-bar">
      <div class="action-row">
        <button class="btn-action btn-save"  onclick="saveData()">💾 저장</button>
        <button class="btn-action btn-reset" onclick="resetAll()">초기화</button>
      </div>
      <button class="btn-action btn-excel" onclick="exportExcel()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="8" y1="13" x2="16" y2="13"/>
          <line x1="8" y1="17" x2="16" y2="17"/>
        </svg>
        Excel 내보내기
      </button>
    </div>

  </div>

  <!-- ══ 우측 패널 (리스트) ══ -->
  <div class="right-panel">
    <div class="card">
      <div class="list-header">
        <span class="list-title" id="listTitle">예산 항목</span>
        <span class="list-count" id="listCount">0개</span>
      </div>
      <div id="itemList"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════
//  상태
// ════════════════════════
let mode          = 'budget';
let salary        = 0;
let budgetItems   = [];          // { id, purpose, amount }
let expenseAmounts = {};         // { [budgetItemId]: actualSpent }
let editingId     = null;

// ════════════════════════
//  계산
// ════════════════════════
const budgetTotal   = () => budgetItems.reduce((s, i) => s + i.amount, 0);
const budgetRemain  = () => salary - budgetTotal();
const actualTotal   = () => budgetItems.reduce((s, i) => s + (expenseAmounts[i.id] || 0), 0);
const actualRemain  = () => salary - actualTotal();

// ════════════════════════
//  초기화
// ════════════════════════
(function init() {
  buildPeriodSelectors();
  loadData();

  document.getElementById('purposeInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('amountInput').focus();
  });
  document.getElementById('amountInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addBudgetItem();
  });
  document.getElementById('salaryInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') setSalary();
  });
})();

function buildPeriodSelectors() {
  const now  = new Date();
  const ysel = document.getElementById('yearSelect');
  const msel = document.getElementById('monthSelect');
  for (let y = now.getFullYear() - 3; y <= now.getFullYear() + 2; y++) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y + '년';
    if (y === now.getFullYear()) o.selected = true;
    ysel.appendChild(o);
  }
  for (let m = 1; m <= 12; m++) {
    const o = document.createElement('option');
    o.value = m; o.textContent = m + '월';
    if (m === now.getMonth() + 1) o.selected = true;
    msel.appendChild(o);
  }
  ysel.addEventListener('change', () => { editingId = null; loadData(); });
  msel.addEventListener('change', () => { editingId = null; loadData(); });
}

function periodKey() {
  return `budget_${document.getElementById('yearSelect').value}_${document.getElementById('monthSelect').value}`;
}

// ════════════════════════
//  모드 전환
// ════════════════════════
function switchMode(m) {
  mode = m;
  editingId = null;
  renderAll();
}

// ════════════════════════
//  저장 / 불러오기
// ════════════════════════
function saveData() {
  localStorage.setItem(periodKey(), JSON.stringify({ salary, budgetItems, expenseAmounts }));
  showToast('저장되었습니다.');
}

function loadData() {
  const raw = localStorage.getItem(periodKey());
  if (raw) {
    try {
      const d = JSON.parse(raw);
      salary         = d.salary         || 0;
      budgetItems    = d.budgetItems    || [];
      expenseAmounts = d.expenseAmounts || {};
    } catch { salary = 0; budgetItems = []; expenseAmounts = {}; }
  } else {
    salary = 0; budgetItems = []; expenseAmounts = {};
  }
  document.getElementById('salaryInput').value = salary || '';
  renderAll();
}

// ════════════════════════
//  월급 설정
// ════════════════════════
function setSalary() {
  const v = parseFloat(document.getElementById('salaryInput').value);
  if (isNaN(v) || v < 0) { showToast('올바른 금액을 입력해주세요.'); return; }
  salary = v;
  renderAll();
  showToast('월급이 설정되었습니다.');
}

// ════════════════════════
//  예산 항목 추가
// ════════════════════════
function addBudgetItem() {
  const purpose = document.getElementById('purposeInput').value.trim();
  const amount  = parseFloat(document.getElementById('amountInput').value);
  if (!purpose) { showToast('목적을 입력해주세요.'); return; }
  if (isNaN(amount) || amount <= 0) { showToast('올바른 금액을 입력해주세요.'); return; }
  budgetItems.push({ id: Date.now(), purpose, amount });
  document.getElementById('purposeInput').value = '';
  document.getElementById('amountInput').value  = '';
  document.getElementById('purposeInput').focus();
  renderAll();
}

// ════════════════════════
//  예산 항목 삭제
// ════════════════════════
function deleteBudgetItem(id) {
  budgetItems = budgetItems.filter(i => i.id !== id);
  delete expenseAmounts[id];
  if (editingId === id) editingId = null;
  renderAll();
}

// ════════════════════════
//  인라인 편집
// ════════════════════════
function startEdit(id) {
  editingId = id;
  renderBudgetList();
  requestAnimationFrame(() => {
    const el = document.getElementById(`ep-${id}`);
    if (el) el.focus();
  });
}

function saveEdit(id) {
  const p = document.getElementById(`ep-${id}`).value.trim();
  const a = parseFloat(document.getElementById(`ea-${id}`).value);
  if (!p) { showToast('목적을 입력해주세요.'); return; }
  if (isNaN(a) || a <= 0) { showToast('올바른 금액을 입력해주세요.'); return; }
  const item = budgetItems.find(i => i.id === id);
  if (item) { item.purpose = p; item.amount = a; }
  editingId = null;
  renderAll();
  showToast('수정되었습니다.');
}

function cancelEdit() {
  editingId = null;
  renderBudgetList();
}

// ════════════════════════
//  지출 입력 (부분 업데이트)
// ════════════════════════
function updateExpense(id, value) {
  const v = parseFloat(value);
  expenseAmounts[id] = (isNaN(v) || v < 0) ? 0 : v;

  // 해당 행의 잔액 셀만 업데이트
  const item = budgetItems.find(i => i.id === id);
  if (item) {
    const remain = item.amount - expenseAmounts[id];
    const el = document.getElementById(`er-${id}`);
    if (el) {
      el.textContent = formatWon(remain);
      el.className   = 'expense-remain' + (remain < 0 ? ' negative' : '');
    }
  }

  // 합계 행 업데이트
  refreshExpenseTotals();

  // 좌측 요약 업데이트
  renderSummary();
}

function refreshExpenseTotals() {
  const totalA  = actualTotal();
  const totalB  = budgetTotal();
  const finalR  = actualRemain();

  const elA = document.getElementById('etotal-actual');
  const elR = document.getElementById('efinal-amt');
  if (elA) elA.textContent = formatWon(totalA);
  if (elR) {
    elR.textContent = formatWon(finalR);
    elR.className   = 'expense-final-amt' + (finalR < 0 ? ' negative' : '');
  }

  // 합계 행 총예산도
  const elB = document.getElementById('etotal-budget');
  if (elB) elB.textContent = formatWon(totalB);
}

// ════════════════════════
//  초기화
// ════════════════════════
function resetAll() {
  if (mode === 'budget') {
    if (!confirm('예산안 데이터(월급·항목)를 초기화하시겠습니까?')) return;
    salary = 0; budgetItems = []; expenseAmounts = {};
    document.getElementById('salaryInput').value = '';
  } else {
    if (!confirm('지출 내역을 초기화하시겠습니까?')) return;
    expenseAmounts = {};
  }
  editingId = null;
  localStorage.removeItem(periodKey());
  renderAll();
  showToast('초기화되었습니다.');
}

// ════════════════════════
//  렌더링
// ════════════════════════
function renderAll() {
  renderModeUI();
  renderSummary();
  if (mode === 'budget') renderBudgetList();
  else                   renderExpenseList();
}

function renderModeUI() {
  const isBudget = mode === 'budget';

  document.getElementById('tab-budget').className  = 'mode-tab' + (isBudget  ? ' budget-active'  : '');
  document.getElementById('tab-expense').className = 'mode-tab' + (!isBudget ? ' expense-active' : '');

  document.getElementById('salarySection').style.display      = isBudget  ? '' : 'none';
  document.getElementById('expenseGuideSection').style.display = !isBudget ? '' : 'none';
  document.getElementById('addFormCard').style.display         = isBudget  ? '' : 'none';

  document.getElementById('summaryTitle').textContent = isBudget ? '예산 현황' : '지출 현황';
  document.getElementById('listTitle').textContent    = isBudget ? '예산 항목' : '지출 내역';
}

function renderSummary() {
  const isBudget = mode === 'budget';
  let items, pctBase, used, remain, fillClass;

  if (isBudget) {
    const total = salary;
    used   = budgetTotal();
    remain = budgetRemain();
    pctBase = total;
    fillClass = 'progress-fill budget';
    items = [
      { label: '월급',     amt: total,  cls: 'c-blue'  },
      { label: '예산 지출', amt: used,   cls: 'c-red'   },
      { label: '잔액',     amt: remain, cls: remain < 0 ? 'c-red' : 'c-green' },
      { label: '예산 비율', amt: pctBase > 0 ? (used / pctBase * 100).toFixed(1) + '%' : '0%', cls: 'c-blue', isText: true },
    ];
  } else {
    const budgR = budgetRemain();
    used   = actualTotal();
    remain = actualRemain();
    pctBase = salary;
    fillClass = 'progress-fill expense';
    items = [
      { label: '예산 잔액',  amt: budgR,  cls: budgR  < 0 ? 'c-red' : 'c-purple' },
      { label: '실제 지출',  amt: used,   cls: 'c-red'   },
      { label: '최종 잔액',  amt: remain, cls: remain < 0 ? 'c-red' : 'c-purple' },
      { label: '지출 비율',  amt: pctBase > 0 ? (used / pctBase * 100).toFixed(1) + '%' : '0%', cls: 'c-purple', isText: true },
    ];
  }

  const over = remain < 0;
  const pct  = pctBase > 0 ? Math.min((used / pctBase) * 100, 100) : 0;

  document.getElementById('summaryGrid').innerHTML = items.map(it => `
    <div class="summary-item">
      <div class="s-label">${it.label}</div>
      <div class="s-amt ${it.cls}">${it.isText ? it.amt : formatWon(it.amt)}</div>
    </div>`).join('');

  const fill = document.getElementById('progressFill');
  fill.className = fillClass + (over ? ' over' : '');
  fill.style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct.toFixed(1) + '% 사용';
  document.getElementById('listCount').textContent   = budgetItems.length + '개';
}

// ── 예산안 리스트 ──
function renderBudgetList() {
  const list  = document.getElementById('itemList');
  const total = budgetTotal();

  if (budgetItems.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
        </svg>
        아직 추가된 예산 항목이 없습니다.
      </div>`;
    return;
  }

  list.innerHTML = budgetItems.map((item, idx) => {
    const pct = total > 0 ? ((item.amount / total) * 100).toFixed(1) : '0.0';

    if (item.id === editingId) {
      return `
        <div class="budget-item editing">
          <div class="item-num">${idx + 1}</div>
          <div class="edit-form">
            <input class="edit-input edit-purpose" id="ep-${item.id}"
              value="${escHtml(item.purpose)}"
              onkeydown="if(event.key==='Enter')saveEdit(${item.id});if(event.key==='Escape')cancelEdit()" />
            <input class="edit-input edit-amount" id="ea-${item.id}"
              type="number" value="${item.amount}" min="0" step="1000"
              onkeydown="if(event.key==='Enter')saveEdit(${item.id});if(event.key==='Escape')cancelEdit()" />
            <button class="btn-confirm" onclick="saveEdit(${item.id})">저장</button>
            <button class="btn-cancel"  onclick="cancelEdit()">취소</button>
          </div>
        </div>`;
    }

    return `
      <div class="budget-item">
        <div class="item-num">${idx + 1}</div>
        <div class="item-purpose" title="${escHtml(item.purpose)}">${escHtml(item.purpose)}</div>
        <div class="item-pct">${pct}%</div>
        <div class="item-amount">-${formatWon(item.amount)}</div>
        <div class="item-actions">
          <button class="btn-icon edit"   onclick="startEdit(${item.id})" title="수정">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="btn-icon delete" onclick="deleteBudgetItem(${item.id})" title="삭제">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </button>
        </div>
      </div>`;
  }).join('');
}

// ── 지출 내역 테이블 ──
function renderExpenseList() {
  const list = document.getElementById('itemList');

  if (budgetItems.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        예산안 모드에서 먼저 예산 항목을 추가해주세요.
      </div>`;
    return;
  }

  const totalB = budgetTotal();
  const totalA = actualTotal();
  const finalR = actualRemain();

  const rows = budgetItems.map((item, idx) => {
    const actual = expenseAmounts[item.id] || 0;
    const remain = item.amount - actual;
    return `
      <div class="expense-row expense-item">
        <div class="expense-num">${idx + 1}</div>
        <div class="expense-name" title="${escHtml(item.purpose)}">${escHtml(item.purpose)}</div>
        <div class="expense-budget-amt">${formatWon(item.amount)}</div>
        <input class="expense-input" type="number"
          value="${actual || ''}" placeholder="0" min="0" step="1000"
          oninput="updateExpense(${item.id}, this.value)" />
        <div class="expense-remain${remain < 0 ? ' negative' : ''}" id="er-${item.id}">${formatWon(remain)}</div>
      </div>`;
  }).join('');

  list.innerHTML = `
    <div class="expense-table">
      <div class="expense-row expense-header">
        <span>#</span>
        <span>항목</span>
        <span style="text-align:right">예산</span>
        <span style="text-align:right">실제 지출</span>
        <span style="text-align:right">잔액</span>
      </div>
      ${rows}
      <div class="expense-total-row">
        <div class="expense-total-label" style="grid-column:1/3">합계</div>
        <div class="expense-total-budget" id="etotal-budget">${formatWon(totalB)}</div>
        <div class="expense-total-actual" id="etotal-actual">${formatWon(totalA)}</div>
        <div class="expense-remain${totalB - totalA < 0 ? ' negative' : ''}">${formatWon(totalB - totalA)}</div>
      </div>
    </div>
    <div class="expense-final-row">
      <span class="expense-final-label">최종 잔액 (월급 − 실제 지출)</span>
      <span class="expense-final-amt${finalR < 0 ? ' negative' : ''}" id="efinal-amt">${formatWon(finalR)}</span>
    </div>`;
}

// ════════════════════════
//  Excel 내보내기
// ════════════════════════
function exportExcel() {
  const year  = document.getElementById('yearSelect').value;
  const month = document.getElementById('monthSelect').value;
  const wb    = XLSX.utils.book_new();

  // 시트 1: 예산안
  const bTotal  = budgetTotal();
  const bData = [
    [`${year}년 ${month}월 예산안`],
    [],
    ['월급', salary],
    ['총 예산 지출', bTotal],
    ['잔액', salary - bTotal],
    [],
    ['번호', '예산 목적', '예산 금액 (원)', '비율 (%)'],
    ...budgetItems.map((item, i) => [
      i + 1, item.purpose, item.amount,
      bTotal > 0 ? Number(((item.amount / bTotal) * 100).toFixed(1)) : 0
    ]),
    [],
    ['', '합계', bTotal, 100],
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(bData);
  ws1['!cols']   = [{ wch: 6 }, { wch: 22 }, { wch: 16 }, { wch: 10 }];
  ws1['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 3 } }];
  XLSX.utils.book_append_sheet(wb, ws1, '예산안');

  // 시트 2: 지출 내역 비교
  const totalA = actualTotal();
  const eData = [
    [`${year}년 ${month}월 지출 내역`],
    [],
    ['월급', salary],
    ['실제 지출 합계', totalA],
    ['최종 잔액', salary - totalA],
    [],
    ['번호', '항목', '예산 금액', '실제 지출', '잔액 (예산 - 지출)'],
    ...budgetItems.map((item, i) => {
      const actual = expenseAmounts[item.id] || 0;
      return [i + 1, item.purpose, item.amount, actual, item.amount - actual];
    }),
    [],
    ['', '합계', bTotal, totalA, bTotal - totalA],
    [],
    ['최종 잔액 (월급 - 실제지출)', '', '', '', salary - totalA],
  ];
  const ws2 = XLSX.utils.aoa_to_sheet(eData);
  ws2['!cols'] = [{ wch: 6 }, { wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 18 }];
  ws2['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 4 } }];
  XLSX.utils.book_append_sheet(wb, ws2, '지출내역');

  const filename = `예산관리_${year}년_${month}월.xlsx`;
  XLSX.writeFile(wb, filename);
  showToast(`"${filename}" 저장 완료`);
}

// ════════════════════════
//  유틸
// ════════════════════════
function formatWon(n) {
  const abs = Math.abs(Math.round(n));
  return (n < 0 ? '-' : '') + '₩' + abs.toLocaleString('ko-KR');
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
