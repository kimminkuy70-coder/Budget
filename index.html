<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예산안 관리</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI','Apple SD Gothic Neo',sans-serif; background:#f0f4f8; min-height:100vh; color:#1e293b; }

    header { background:linear-gradient(135deg,#1e40af,#3b82f6); color:white; padding:18px 28px; box-shadow:0 4px 12px rgba(30,64,175,.25); }
    header h1 { font-size:1.25rem; font-weight:700; }
    header p  { font-size:.8rem; opacity:.75; margin-top:2px; }

    .app-layout { display:flex; gap:20px; padding:24px; max-width:1300px; margin:0 auto; align-items:flex-start; }
    .left-panel  { width:360px; flex-shrink:0; display:flex; flex-direction:column; gap:14px; }
    .right-panel { flex:1; min-width:0; }

    .card { background:white; border-radius:14px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .card-label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:#94a3b8; margin-bottom:10px; }

    /* mode tabs */
    .mode-tabs { display:flex; background:white; border-radius:14px; padding:6px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .mode-tab { flex:1; padding:10px; border:none; border-radius:10px; background:transparent; cursor:pointer; font-size:.88rem; font-weight:600; color:#94a3b8; transition:all .2s; }
    .mode-tab.ba { background:#1e40af; color:white; box-shadow:0 2px 8px rgba(30,64,175,.3); }
    .mode-tab.ea { background:#7c3aed; color:white; box-shadow:0 2px 8px rgba(124,58,237,.3); }

    /* period */
    .period-row { display:flex; gap:8px; margin-bottom:12px; }
    .period-row select { flex:1; border:2px solid #e2e8f0; border-radius:8px; padding:7px 10px; font-size:.85rem; color:#1e293b; outline:none; background:#f8fafc; cursor:pointer; }
    .period-row select:focus { border-color:#3b82f6; }

    /* input */
    .input-wrap { display:flex; align-items:center; border:2px solid #e2e8f0; border-radius:10px; overflow:hidden; transition:border-color .2s; }
    .input-wrap:focus-within { border-color:#3b82f6; }
    .input-wrap .pfx { padding:0 12px; background:#f8fafc; color:#64748b; height:44px; display:flex; align-items:center; border-right:1px solid #e2e8f0; font-size:.9rem; }
    .input-wrap input { border:none; outline:none; padding:0 12px; font-size:1rem; font-weight:600; color:#1e293b; height:44px; width:100%; background:transparent; }
    .btn-set { margin-top:8px; width:100%; height:40px; background:#1e40af; color:white; border:none; border-radius:10px; cursor:pointer; font-size:.88rem; font-weight:600; transition:background .2s; }
    .btn-set:hover { background:#1d3a9e; }

    /* carryover badge */
    .carryover-box { background:#eff6ff; border-radius:10px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
    .carryover-box .cl { font-size:.78rem; color:#1e40af; font-weight:600; }
    .carryover-box .cv { font-size:1rem; font-weight:700; color:#1e40af; }
    .carryover-box.neg .cv { color:#ef4444; }

    /* summary */
    .sum-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .sum-item { background:#f8fafc; border-radius:10px; padding:10px; text-align:center; }
    .sum-item .sl { font-size:.7rem; color:#64748b; font-weight:600; margin-bottom:3px; }
    .sum-item .sv { font-size:.95rem; font-weight:700; }
    .c-blue { color:#1e40af; } .c-red { color:#ef4444; } .c-green { color:#10b981; } .c-purple { color:#7c3aed; }

    .prog-wrap { margin-top:12px; }
    .prog-bg { height:8px; background:#e2e8f0; border-radius:99px; overflow:hidden; }
    .prog-fill { height:100%; border-radius:99px; transition:width .4s; }
    .prog-fill.b { background:linear-gradient(90deg,#3b82f6,#6366f1); }
    .prog-fill.e { background:linear-gradient(90deg,#7c3aed,#a855f7); }
    .prog-fill.ov { background:linear-gradient(90deg,#ef4444,#f97316); }
    .prog-lbl { display:flex; justify-content:space-between; font-size:.7rem; color:#94a3b8; margin-top:3px; }

    /* add form */
    .form-col { display:flex; flex-direction:column; gap:8px; }
    .fg { display:flex; flex-direction:column; gap:4px; }
    .fg label { font-size:.73rem; font-weight:600; color:#475569; }
    .fg input { border:2px solid #e2e8f0; border-radius:10px; padding:0 12px; height:40px; font-size:.9rem; outline:none; color:#1e293b; transition:border-color .2s; }
    .fg input:focus { border-color:#3b82f6; }
    .fg input.ep:focus { border-color:#7c3aed; }
    .btn-add { height:40px; background:#10b981; color:white; border:none; border-radius:10px; cursor:pointer; font-size:.88rem; font-weight:600; transition:background .2s; }
    .btn-add:hover { background:#059669; }
    .btn-add.ep { background:#7c3aed; }
    .btn-add.ep:hover { background:#6d28d9; }

    /* action */
    .act-bar { display:flex; flex-direction:column; gap:8px; }
    .act-row { display:flex; gap:8px; }
    .btn-act { flex:1; height:40px; border:none; border-radius:10px; cursor:pointer; font-size:.84rem; font-weight:600; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:5px; }
    .btn-save  { background:#f1f5f9; color:#475569; }
    .btn-save:hover  { background:#e2e8f0; }
    .btn-rst   { background:#fee2e2; color:#ef4444; }
    .btn-rst:hover   { background:#fecaca; }
    .btn-xl    { background:#14532d; color:white; }
    .btn-xl:hover    { background:#166534; }

    /* right panel */
    .right-panel .card { min-height:calc(100vh - 150px); }
    .list-hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .list-title { font-size:1rem; font-weight:700; }
    .list-cnt { font-size:.75rem; background:#f1f5f9; color:#64748b; padding:3px 10px; border-radius:99px; font-weight:600; }

    /* ── tree items (budget mode) ── */
    .tree-item {
      display:flex; align-items:center; gap:8px;
      padding:11px 14px; background:#f8fafc; border-radius:10px;
      margin-bottom:6px; position:relative; cursor:default;
      transition:background .15s;
      border:2px solid transparent;
    }
    .tree-item:hover { background:#f1f5f9; }
    .tree-item.dragging { opacity:.35; }
    .tree-item.drop-before { border-top:3px solid #3b82f6; border-radius:10px; }
    .tree-item.drop-after  { border-bottom:3px solid #3b82f6; border-radius:10px; }
    .tree-item.drop-on     { border:2px solid #3b82f6; background:#eff6ff; }
    .tree-item.drop-before.ep { border-top-color:#7c3aed; }
    .tree-item.drop-after.ep  { border-bottom-color:#7c3aed; }
    .tree-item.drop-on.ep     { border-color:#7c3aed; background:#f5f3ff; }

    .drag-handle { cursor:grab; color:#cbd5e1; flex-shrink:0; display:flex; align-items:center; padding:2px; border-radius:4px; }
    .drag-handle:hover { color:#94a3b8; background:#e2e8f0; }
    .drag-handle:active { cursor:grabbing; }

    .item-num { width:22px; height:22px; background:#dbeafe; color:#1e40af; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:700; flex-shrink:0; }
    .item-num.ep { background:#ede9fe; color:#7c3aed; }
    .item-num.unexp { background:#fce7f3; color:#db2777; }

    .item-purpose { flex:1; font-weight:500; font-size:.9rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .item-pct { font-size:.7rem; color:#94a3b8; width:36px; text-align:right; flex-shrink:0; }
    .item-amt { font-weight:700; font-size:.88rem; color:#ef4444; white-space:nowrap; flex-shrink:0; }
    .item-amt.ep { color:#7c3aed; }

    .btn-ico { background:none; border:none; cursor:pointer; width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:all .15s; color:#cbd5e1; flex-shrink:0; }
    .btn-ico.edit:hover   { background:#dbeafe; color:#1e40af; }
    .btn-ico.del:hover    { background:#fee2e2; color:#ef4444; }

    /* inline edit */
    .tree-item.editing { background:#eff6ff; border:2px solid #bfdbfe; padding:9px 12px; }
    .edit-form { display:flex; align-items:center; gap:7px; width:100%; flex-wrap:wrap; }
    .ei { border:2px solid #bfdbfe; border-radius:8px; padding:0 10px; height:32px; font-size:.86rem; outline:none; color:#1e293b; background:white; }
    .ei:focus { border-color:#3b82f6; }
    .ei.ep { border-color:#ddd6fe; }
    .ei.ep:focus { border-color:#7c3aed; }
    .ei-p { flex:2; min-width:90px; }
    .ei-a { flex:1; min-width:70px; }
    .btn-ok { height:32px; padding:0 10px; background:#1e40af; color:white; border:none; border-radius:7px; cursor:pointer; font-size:.8rem; font-weight:600; }
    .btn-ok:hover { background:#1d3a9e; }
    .btn-ok.ep { background:#7c3aed; }
    .btn-ok.ep:hover { background:#6d28d9; }
    .btn-cx { height:32px; padding:0 10px; background:#f1f5f9; color:#64748b; border:none; border-radius:7px; cursor:pointer; font-size:.8rem; font-weight:600; }

    /* ── expense mode table ── */
    .exp-table { width:100%; }
    .exp-row { display:grid; grid-template-columns:28px 1fr 110px 130px 100px; gap:8px; align-items:center; padding:9px 6px; border-bottom:1px solid #f1f5f9; }
    .exp-row:last-child { border-bottom:none; }
    .exp-hdr { font-size:.68rem; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:.5px; padding:4px 6px 10px; border-bottom:2px solid #e2e8f0 !important; }
    .exp-item { transition:background .15s; border-radius:6px; }
    .exp-item:hover { background:#fafafa; }
    .exp-item.unexp-row { background:#fdf4ff; }
    .exp-item.unexp-row:hover { background:#fae8ff; }
    .exp-item.dragging { opacity:.35; }
    .exp-item.drop-before { border-top:2px solid #7c3aed; }
    .exp-item.drop-after  { border-bottom:2px solid #7c3aed; }
    .exp-item.drop-on     { outline:2px solid #7c3aed; background:#f5f3ff; }

    .exp-bamt { font-size:.85rem; color:#1e40af; font-weight:600; text-align:right; }
    .exp-input { width:100%; border:2px solid #e2e8f0; border-radius:7px; padding:0 8px; height:32px; font-size:.85rem; font-weight:600; outline:none; color:#1e293b; transition:border-color .2s; text-align:right; }
    .exp-input:focus { border-color:#7c3aed; }
    .exp-input[readonly] { background:#f8fafc; color:#94a3b8; cursor:default; border-color:transparent; font-size:.82rem; }
    .exp-remain { font-size:.85rem; font-weight:700; color:#10b981; text-align:right; }
    .exp-remain.neg { color:#ef4444; }
    .unexp-badge { font-size:.65rem; background:#fae8ff; color:#9333ea; padding:1px 5px; border-radius:4px; font-weight:700; white-space:nowrap; }
    .exp-name { font-weight:500; font-size:.87rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:5px; }

    .exp-total-row { display:grid; grid-template-columns:28px 1fr 110px 130px 100px; gap:8px; align-items:center; background:#f8fafc; border-radius:10px; padding:12px 6px; margin-top:10px; font-weight:700; }
    .exp-total-lbl { grid-column:1/3; font-size:.82rem; color:#475569; }
    .exp-tbamt { font-size:.85rem; color:#1e40af; text-align:right; }
    .exp-tact  { font-size:.85rem; color:#ef4444; text-align:right; }
    .exp-trem  { font-size:.85rem; font-weight:700; text-align:right; }

    .exp-final { display:flex; justify-content:space-between; align-items:center; background:#f5f3ff; border-radius:10px; padding:14px 16px; margin-top:8px; }
    .exp-final-lbl { font-size:.85rem; font-weight:700; color:#6d28d9; }
    .exp-final-amt { font-size:1.15rem; font-weight:700; color:#7c3aed; }
    .exp-final-amt.neg { color:#ef4444; }

    /* carryover in expense final */
    .exp-co-row { display:flex; justify-content:space-between; align-items:center; background:#eff6ff; border-radius:10px; padding:10px 16px; margin-top:8px; }
    .exp-co-lbl { font-size:.78rem; font-weight:600; color:#1e40af; }
    .exp-co-amt { font-size:.9rem; font-weight:700; color:#1e40af; }

    /* empty */
    .empty { text-align:center; color:#cbd5e1; padding:60px 0; font-size:.9rem; }
    .empty svg { display:block; margin:0 auto 10px; opacity:.3; }

    /* toast */
    .toast { position:fixed; bottom:24px; right:24px; background:#1e293b; color:white; padding:11px 18px; border-radius:10px; font-size:.85rem; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.18); transform:translateY(60px); opacity:0; transition:transform .25s,opacity .25s; z-index:1000; }
    .toast.show { transform:translateY(0); opacity:1; }

    /* bracket visualization (budget mode children group) */
    .bracket-group { position:relative; }
    .tree-item.has-kids { background:#eff6ff; }
    .tree-item.has-kids:hover { background:#dbeafe; }
    .bracket-sum-row {
      display:flex; justify-content:flex-end; align-items:center; gap:6px;
      padding:3px 12px 6px; font-size:.73rem;
      border-top:1.5px dashed #93c5fd; margin:0 4px 6px;
    }
    .bsr-label { color:#93c5fd; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
    .bsr-val { font-weight:700; color:#1e40af; font-size:.8rem; }

    @media(max-width:860px){
      .app-layout{flex-direction:column;padding:16px;}
      .left-panel{width:100%;}
      .right-panel .card{min-height:auto;}
      .exp-row,.exp-total-row{grid-template-columns:24px 1fr 88px 100px 80px;}
    }
  </style>
</head>
<body>

<header>
  <h1>예산안 관리</h1>
  <p>월급 기반 예산 계획 · 이월 · 계층 구조 · 실제 지출 비교</p>
</header>

<div class="app-layout">

  <!-- ══ 좌측 ══ -->
  <div class="left-panel">

    <div class="mode-tabs">
      <button class="mode-tab ba" id="tab-b" onclick="switchMode('budget')">예산안 모드</button>
      <button class="mode-tab"    id="tab-e" onclick="switchMode('expense')">지출 내역 모드</button>
    </div>

    <!-- 기간 + 월급/안내 -->
    <div class="card">
      <div class="card-label">기간 설정</div>
      <div class="period-row">
        <select id="yearSel"></select>
        <select id="monthSel"></select>
      </div>

      <div id="salSec">
        <div class="card-label">월급</div>
        <div class="input-wrap">
          <span class="pfx">₩</span>
          <input type="number" id="salInput" placeholder="월급 입력" min="0" step="10000"/>
        </div>
        <button class="btn-set" onclick="setSalary()">설정</button>
      </div>

      <div id="coSec" style="display:none">
        <div class="card-label">전월 이월</div>
        <div class="carryover-box" id="coBox">
          <span class="cl">이월 금액</span>
          <span class="cv" id="coVal">₩0</span>
        </div>
      </div>
    </div>

    <!-- 잔액 현황 -->
    <div class="card">
      <div class="card-label" id="sumTitle">예산 현황</div>
      <div class="sum-grid" id="sumGrid"></div>
      <div class="prog-wrap">
        <div class="prog-bg"><div class="prog-fill b" id="progFill" style="width:0%"></div></div>
        <div class="prog-lbl"><span>0%</span><span id="progPct">0%</span><span>100%</span></div>
      </div>
    </div>

    <!-- 추가 폼 -->
    <div class="card" id="addCard">
      <div class="card-label" id="addTitle">예산 항목 추가</div>
      <div class="form-col">
        <div class="fg"><label id="purLbl">예산 목적</label><input type="text"   id="purInput" placeholder="예) 식비, 교통비..."/></div>
        <div class="fg"><label id="amtLbl">금액 (원)</label> <input type="number" id="amtInput" placeholder="0" min="0" step="1000"/></div>
        <button class="btn-add" id="btnAdd" onclick="addItem()">+ 추가</button>
      </div>
    </div>

    <!-- 액션 -->
    <div class="act-bar">
      <div class="act-row">
        <button class="btn-act btn-save" onclick="saveData()">💾 저장</button>
        <button class="btn-act btn-rst"  onclick="resetData()">초기화</button>
      </div>
      <button class="btn-act btn-xl" onclick="exportExcel()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>
        </svg>
        Excel 내보내기
      </button>
    </div>
  </div>

  <!-- ══ 우측 ══ -->
  <div class="right-panel">
    <div class="card">
      <div class="list-hd">
        <span class="list-title" id="listTitle">예산 항목</span>
        <span class="list-cnt"   id="listCnt">0개</span>
      </div>
      <div id="itemList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let mode   = 'budget';
let salary = 0;
// { id, purpose, amount, parentId:null|id, order:int }
let budgetItems        = [];
let expenseAmounts     = {};   // { budgetItemId: actualSpent }
// { id, purpose, amount, parentId:null|budgetItemId, order:int }
let unexpectedExpenses = [];

let editId   = null;
let editType = null; // 'budget' | 'unexp'
let dndId    = null;
let dndIsBudget = true;

// ═══════════════════════════════════════
//  COMPUTED
// ═══════════════════════════════════════
// 예산 합계: 최상위 항목들의 자체 금액 합산 (이중계산 없음)
const budgetTotal = () => budgetItems.filter(i=>i.parentId===null).reduce((s,i)=>s+i.amount,0);
// 실제 지출 합계: 최상위 항목들의 실제 지출 합산
const actualTotal = () => budgetItems.filter(i=>i.parentId===null).reduce((s,i)=>s+(expenseAmounts[i.id]||0),0);
const unexpTotal  = () => unexpectedExpenses.reduce((s,i)=>s+i.amount,0);
// 직계 하위 항목 금액 합산 (bracket 표시용)
function childrenAmtSum(pid){ return budgetItems.filter(i=>i.parentId===pid).reduce((s,c)=>s+c.amount,0); }

function getCarryover() {
  const y = +document.getElementById('yearSel').value;
  const m = +document.getElementById('monthSel').value;
  const pm = m===1?12:m-1, py = m===1?y-1:y;
  const raw = localStorage.getItem(`budget_${py}_${pm}`);
  if (!raw) return 0;
  try {
    const d = JSON.parse(raw);
    const bi = d.budgetItems||[], ea = d.expenseAmounts||{}, ue = d.unexpectedExpenses||[];
    const act   = bi.filter(i=>i.parentId===null).reduce((s,i)=>s+(ea[i.id]||0),0);
    const unexp = ue.reduce((s,i)=>s+i.amount,0);
    return (d.salary||0) - act - unexp;
  } catch { return 0; }
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
(function init(){
  buildPeriod();
  loadData();
  ['purInput','amtInput'].forEach((id,i)=>{
    document.getElementById(id).addEventListener('keydown',e=>{
      if(e.key==='Enter') i===0 ? document.getElementById('amtInput').focus() : addItem();
    });
  });
  document.getElementById('salInput').addEventListener('keydown',e=>{
    if(e.key==='Enter') setSalary();
  });
})();

function buildPeriod(){
  const now=new Date(), ysel=document.getElementById('yearSel'), msel=document.getElementById('monthSel');
  for(let y=now.getFullYear()-3;y<=now.getFullYear()+2;y++){
    const o=document.createElement('option'); o.value=y; o.textContent=y+'년';
    if(y===now.getFullYear()) o.selected=true; ysel.appendChild(o);
  }
  for(let m=1;m<=12;m++){
    const o=document.createElement('option'); o.value=m; o.textContent=m+'월';
    if(m===now.getMonth()+1) o.selected=true; msel.appendChild(o);
  }
  ysel.addEventListener('change',()=>{editId=null;loadData();});
  msel.addEventListener('change',()=>{editId=null;loadData();});
}

function periodKey(){
  return `budget_${document.getElementById('yearSel').value}_${document.getElementById('monthSel').value}`;
}

// ═══════════════════════════════════════
//  SAVE / LOAD
// ═══════════════════════════════════════
function saveData(){
  localStorage.setItem(periodKey(), JSON.stringify({salary,budgetItems,expenseAmounts,unexpectedExpenses}));
  toast('저장되었습니다.');
}

function loadData(){
  const raw=localStorage.getItem(periodKey());
  if(raw){
    try{
      const d=JSON.parse(raw);
      salary             = d.salary             || 0;
      budgetItems        = d.budgetItems        || [];
      expenseAmounts     = d.expenseAmounts     || {};
      unexpectedExpenses = d.unexpectedExpenses || [];
    }catch{ salary=0; budgetItems=[]; expenseAmounts={}; unexpectedExpenses=[]; }
  } else {
    salary=0; budgetItems=[]; expenseAmounts={}; unexpectedExpenses=[];
  }
  document.getElementById('salInput').value = salary||'';
  renderAll();
}

function setSalary(){
  const v=parseFloat(document.getElementById('salInput').value);
  if(isNaN(v)||v<0){toast('올바른 금액을 입력해주세요.');return;}
  salary=v; renderAll(); toast('월급이 설정되었습니다.');
}

// ═══════════════════════════════════════
//  ADD ITEM
// ═══════════════════════════════════════
function addItem(){
  const purpose = document.getElementById('purInput').value.trim();
  const amount  = parseFloat(document.getElementById('amtInput').value);
  if(!purpose){toast('목적을 입력해주세요.');return;}
  if(isNaN(amount)||amount<=0){toast('올바른 금액을 입력해주세요.');return;}

  const id = Date.now();
  if(mode==='budget'){
    const maxOrder = budgetItems.filter(i=>i.parentId===null).reduce((m,i)=>Math.max(m,i.order),-1);
    budgetItems.push({id, purpose, amount, parentId:null, order:maxOrder+1});
  } else {
    const maxOrder = unexpectedExpenses.filter(i=>i.parentId===null).reduce((m,i)=>Math.max(m,i.order),-1);
    unexpectedExpenses.push({id, purpose, amount, parentId:null, order:maxOrder+1});
  }
  document.getElementById('purInput').value='';
  document.getElementById('amtInput').value='';
  document.getElementById('purInput').focus();
  renderAll();
}

// ═══════════════════════════════════════
//  DELETE
// ═══════════════════════════════════════
function deleteItem(id, isBudget){
  if(isBudget){
    // also delete descendants
    function collectDesc(pid){ return budgetItems.filter(i=>i.parentId===pid).flatMap(i=>[i.id,...collectDesc(i.id)]); }
    const toRemove = new Set([id,...collectDesc(id)]);
    budgetItems = budgetItems.filter(i=>!toRemove.has(i.id));
    toRemove.forEach(rid=>delete expenseAmounts[rid]);
    // orphan unexpected that were sub-items
    unexpectedExpenses.forEach(u=>{ if(toRemove.has(u.parentId)) u.parentId=null; });
  } else {
    // also delete sub-unexpected
    function collectUDesc(pid){ return unexpectedExpenses.filter(i=>i.parentId===pid).flatMap(i=>[i.id,...collectUDesc(i.id)]); }
    const toRemove = new Set([id,...collectUDesc(id)]);
    unexpectedExpenses = unexpectedExpenses.filter(i=>!toRemove.has(i.id));
  }
  if(editId===id) editId=null;
  renderAll();
}

//  INLINE EDIT
// ═══════════════════════════════════════
function startEdit(id, isBudget){ editId=id; editType=isBudget?'budget':'unexp'; renderList(); requestAnimationFrame(()=>{ const el=document.getElementById(`ep-${id}`); if(el)el.focus(); }); }

function saveEdit(id){
  const p=document.getElementById(`ep-${id}`).value.trim();
  const a=parseFloat(document.getElementById(`ea-${id}`).value);
  if(!p){toast('목적을 입력해주세요.');return;}
  if(isNaN(a)||a<=0){toast('올바른 금액을 입력해주세요.');return;}
  const arr = editType==='budget' ? budgetItems : unexpectedExpenses;
  const item = arr.find(i=>i.id===id);
  if(item){item.purpose=p; item.amount=a;}
  editId=null; renderAll(); toast('수정되었습니다.');
}
function cancelEdit(){ editId=null; renderList(); }

// ═══════════════════════════════════════
//  EXPENSE INPUT (partial update)
// ═══════════════════════════════════════
function updateExpRemain(id){
  const item=budgetItems.find(i=>i.id===id); if(!item) return;
  const r=item.amount-(expenseAmounts[id]||0);
  const el=document.getElementById(`er-${id}`);
  if(el){el.textContent=fw(r); el.className='exp-remain'+(r<0?' neg':'');}
}

function updateExpense(id, val){
  const v=parseFloat(val); expenseAmounts[id]=(isNaN(v)||v<0)?0:v;
  updateExpRemain(id);
  // 상위 항목 실제 지출을 하위 합산으로 자동 업데이트
  const item=budgetItems.find(i=>i.id===id);
  if(item){
    let pid=item.parentId;
    while(pid!==null&&pid!==undefined){
      const par=budgetItems.find(i=>i.id===pid); if(!par) break;
      expenseAmounts[pid]=budgetItems.filter(i=>i.parentId===pid).reduce((s,c)=>s+(expenseAmounts[c.id]||0),0);
      const inp=document.getElementById(`exp-inp-${pid}`);
      if(inp) inp.value=expenseAmounts[pid]||'';
      updateExpRemain(pid);
      pid=par.parentId;
    }
  }
  refreshExpTotals(); renderSummary();
}

function refreshExpTotals(){
  const co=getCarryover(), tA=actualTotal(), tU=unexpTotal(), tAU=tA+tU;
  const finalR=salary+co-tAU;
  const tB=budgetTotal();
  const elA=document.getElementById('etA'), elF=document.getElementById('efA');
  if(elA) elA.textContent=fw(tAU);
  if(elF){elF.textContent=fw(finalR); elF.className='exp-final-amt'+(finalR<0?' neg':'');}
  // 합계행 예산/잔액
  const elTB=document.getElementById('etB'), elTR=document.getElementById('etR');
  if(elTB) elTB.textContent=fw(tB);
  if(elTR){elTR.textContent=fw(tB-tAU); elTR.className='exp-trem'+(tB-tAU<0?' neg':'');}
}

// ═══════════════════════════════════════
//  DRAG & DROP
// ═══════════════════════════════════════
function onDragStart(e, id, isBudget){
  dndId=id; dndIsBudget=isBudget;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>e.currentTarget.classList.add('dragging'),0);
}

function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  clearDrop(); dndId=null;
}

function clearDrop(){
  document.querySelectorAll('.drop-before,.drop-after,.drop-on').forEach(el=>{
    el.classList.remove('drop-before','drop-after','drop-on');
  });
}

function onDragOver(e, targetId, isBudgetTarget){
  e.preventDefault(); if(dndId===targetId)return;
  clearDrop();
  const el=e.currentTarget, rect=el.getBoundingClientRect(), pct=(e.clientY-rect.top)/rect.height;
  const cls = pct<0.28?'drop-before':pct>0.72?'drop-after':'drop-on';
  el.classList.add(cls); if(!isBudgetTarget) el.classList.add('ep');
}

function onDrop(e, targetId, isBudgetTarget){
  e.preventDefault(); clearDrop();
  if(!dndId||dndId===targetId)return;
  const rect=e.currentTarget.getBoundingClientRect(), pct=(e.clientY-rect.top)/rect.height;
  const pos = pct<0.28?'before':pct>0.72?'after':'on';
  performMove(dndId, dndIsBudget, targetId, isBudgetTarget, pos);
  dndId=null; renderAll();
}

function performMove(dragId, dragIsBudget, targetId, targetIsBudget, pos){
  const dragArr   = dragIsBudget ? budgetItems : unexpectedExpenses;
  const targetArr = targetIsBudget ? budgetItems : unexpectedExpenses;
  const drag   = dragArr.find(i=>i.id===dragId);
  const target = targetArr.find(i=>i.id===targetId);
  if(!drag||!target)return;

  // prevent dropping onto own descendant
  if(dragIsBudget && targetIsBudget){
    function isDesc(pid){ return budgetItems.some(i=>i.parentId===pid&&(i.id===targetId||isDesc(i.id))); }
    if(isDesc(dragId))return;
  }

  const allArr = [...budgetItems, ...unexpectedExpenses];

  if(pos==='on'){
    // Make drag a child of target
    const oldParent=drag.parentId;
    drag.parentId=targetId;
    const newSibs=allArr.filter(i=>i.parentId===targetId&&i.id!==dragId);
    drag.order=newSibs.length;
    reorderSiblings(oldParent, dragId);
  } else {
    const oldParent=drag.parentId;
    drag.parentId=target.parentId;
    const sibs=allArr.filter(i=>i.parentId===target.parentId&&i.id!==dragId).sort((a,b)=>a.order-b.order);
    const ti=sibs.findIndex(i=>i.id===targetId);
    if(ti===-1){ drag.order=0; return; }
    sibs.splice(pos==='before'?ti:ti+1, 0, drag);
    sibs.forEach((it,idx)=>it.order=idx);
    if(oldParent!==target.parentId) reorderSiblings(oldParent, dragId);
  }
}

function reorderSiblings(parentId, excludeId){
  const allArr=[...budgetItems,...unexpectedExpenses];
  allArr.filter(i=>i.parentId===parentId&&i.id!==excludeId).sort((a,b)=>a.order-b.order).forEach((it,idx)=>it.order=idx);
}

  if(ib){

      {l:co!==0?'월급+이월':'월급', v:avail,  c:'c-blue'},

// ── budget mode list (tree with DnD + bracket) ──
function renderBudgetList(){
  const list=document.getElementById('itemList');
  const roots=budgetItems.filter(i=>i.parentId===null).sort((a,b)=>a.order-b.order);
  if(roots.length===0){list.innerHTML=emptyHtml('아직 추가된 예산 항목이 없습니다.');return;}
  const total=budgetTotal();
  let cnt=0;
  function renderItem(item,depth){
    cnt++;
    const myNum=cnt;
    const children=budgetItems.filter(i=>i.parentId===item.id).sort((a,b)=>a.order-b.order);
    const hasKids=children.length>0;
    const pct=total>0?((item.amount/total)*100).toFixed(1):'0.0';
    const indent=depth*24;
    let html='';
    if(item.id===editId){
      html+=`<div class="tree-item editing" style="padding-left:${indent+12}px">
        <div class="edit-form">
          <input class="ei ei-p" id="ep-${item.id}" value="${esc(item.purpose)}"
            onkeydown="if(event.key==='Enter')saveEdit(${item.id});if(event.key==='Escape')cancelEdit()"/>
          <input class="ei ei-a" id="ea-${item.id}" type="number" value="${item.amount}"
            onkeydown="if(event.key==='Enter')saveEdit(${item.id});if(event.key==='Escape')cancelEdit()"/>
          <button class="btn-ok" onclick="saveEdit(${item.id})">저장</button>
          <button class="btn-cx" onclick="cancelEdit()">취소</button>
        </div>
      </div>`;
    } else {
      html+=`<div class="tree-item${hasKids?' has-kids':''}" style="padding-left:${indent+4}px"
        id="ti-${item.id}" draggable="true"
        ondragstart="onDragStart(event,${item.id},true)" ondragend="onDragEnd(event)"
        ondragover="onDragOver(event,${item.id},true)" ondragleave="clearDrop()"
        ondrop="onDrop(event,${item.id},true)">
        <div class="drag-handle">${dragIcon()}</div>
        <div class="item-num">${myNum}</div>
        <div class="item-purpose" title="${esc(item.purpose)}">${esc(item.purpose)}</div>
        <div class="item-pct">${pct}%</div>
        <div class="item-amt">-${fw(item.amount)}</div>
        <div style="display:flex;gap:3px;flex-shrink:0">
          <button class="btn-ico edit" onclick="startEdit(${item.id},true)">${editIcon()}</button>
          <button class="btn-ico del"  onclick="deleteItem(${item.id},true)">${delIcon()}</button>
        </div>
      </div>`;
    }
    if(hasKids){
      const childIndent=(depth+1)*24+4;
      html+=`<div class="bracket-group" style="--bi:${childIndent}px">`;
      children.forEach(c=>{ html+=renderItem(c,depth+1); });
      html+=`<div class="bracket-sum-row" style="padding-left:${childIndent}px">
        <span class="bsr-label">하위 합계</span>
        <span class="bsr-val">${fw(childrenAmtSum(item.id))}</span>
      </div></div>`;
    }
    return html;
  }
  list.innerHTML=roots.map(r=>renderItem(r,0)).join('');
}

function flatBudget(parentId, depth){
  return budgetItems.filter(i=>i.parentId===parentId).sort((a,b)=>a.order-b.order)
    .flatMap(item=>[{item,depth},...flatBudget(item.id,depth+1)]);
}

// 하위가 있는 항목의 실제지출 초기값: 하위 합산 (미설정 시만)
function initParentExpenses(){
  // 깊이 역순(깊은 것 먼저) 처리
  function depth(id,d=0){ const it=budgetItems.find(i=>i.id===id); return it?.parentId?depth(it.parentId,d+1):d; }
  budgetItems.filter(item=>budgetItems.some(i=>i.parentId===item.id))
    .sort((a,b)=>depth(b.id)-depth(a.id))
    .forEach(item=>{
      if(expenseAmounts[item.id]===undefined)
        expenseAmounts[item.id]=budgetItems.filter(i=>i.parentId===item.id).reduce((s,c)=>s+(expenseAmounts[c.id]||0),0);
    });
}

// ── expense mode list (table) ──
function renderExpenseList(){
  const list=document.getElementById('itemList');
  if(budgetItems.length===0&&unexpectedExpenses.length===0){
    list.innerHTML=emptyHtml('예산안 모드에서 예산 항목을 추가하거나,<br>예상치 못한 지출을 추가해주세요.'); return;
  }
  initParentExpenses();

  const co=getCarryover(), tB=budgetTotal(), tA=actualTotal(), tU=unexpTotal(), tAU=tA+tU;
  const finalR=salary+co-tAU;

  // build flat rows (budget items + unexpected expenses interleaved by tree)
  const rows=buildExpenseRows(null, 0);

  list.innerHTML=`
    <div class="exp-table">
      <div class="exp-row exp-hdr">
        <span>#</span><span>항목</span>
        <span style="text-align:right">예산</span>
        <span style="text-align:right">실제 지출</span>
        <span style="text-align:right">잔액</span>
      </div>
      ${rows.map((r,i)=>renderExpRow(r,i+1)).join('')}
      <div class="exp-total-row">
        <div class="exp-total-lbl">합계</div>
        <div class="exp-tbamt" id="etB">${fw(tB)}</div>
        <div class="exp-tact" id="etA">${fw(tAU)}</div>
        <div class="exp-trem ${tB-tAU<0?'neg':''}" id="etR">${fw(tB-tAU)}</div>
      </div>
    </div>
    ${co!==0?`<div class="exp-co-row"><span class="exp-co-lbl">전월 이월 포함</span><span class="exp-co-amt" id="eCo">${fw(co)}</span></div>`:''}
    <div class="exp-final">
      <span class="exp-final-lbl">최종 잔액 (사용가능 − 실제지출 − 예상외)</span>
      <span class="exp-final-amt${finalR<0?' neg':''}" id="efA">${fw(finalR)}</span>
    </div>`;
}

function buildExpenseRows(parentId, depth){
  const result=[];
  // budget items at this level
  budgetItems.filter(i=>i.parentId===parentId).sort((a,b)=>a.order-b.order).forEach(item=>{
    result.push({type:'budget', item, depth});
    // unexpected sub-items of this budget item
    unexpectedExpenses.filter(u=>u.parentId===item.id).sort((a,b)=>a.order-b.order).forEach(u=>{
      result.push({type:'unexp', item:u, depth:depth+1, draggable:true});
    });
    // budget children
    const children=buildExpenseRows(item.id, depth+1);
    result.push(...children);
  });
  // standalone unexpected (parentId=null) only at root
  if(parentId===null){
    unexpectedExpenses.filter(u=>u.parentId===null).sort((a,b)=>a.order-b.order).forEach(u=>{
      result.push({type:'unexp', item:u, depth:0, draggable:true});
    });
  }
  return result;
}

function renderExpRow({type,item,depth,draggable}, idx){
  const indent=depth*22;
  const isBudget=type==='budget';

  if(isBudget){
    const hasKids=budgetItems.some(i=>i.parentId===item.id);
    const actual=expenseAmounts[item.id]||0;
    const remain=item.amount-actual;
    const rowBg=hasKids?'background:#f8fafc;':'';
    const nameBold=hasKids?'font-weight:700;':'';
    const dndAttrs=`draggable="true"
      ondragstart="onDragStart(event,${item.id},true)" ondragend="onDragEnd(event)"
      ondragover="onDragOver(event,${item.id},true)" ondragleave="clearDrop()"
      ondrop="onDrop(event,${item.id},true)"`;
    return `<div class="exp-row exp-item" style="padding-left:${indent+2}px;${rowBg}" ${dndAttrs}>
      <div class="item-num">${idx}</div>
      <div class="exp-name" style="${nameBold}">${esc(item.purpose)}</div>
      <div class="exp-bamt">${fw(item.amount)}</div>
      <input class="exp-input" type="number" id="exp-inp-${item.id}" value="${actual||''}" placeholder="0" min="0" step="1000"
        oninput="updateExpense(${item.id},this.value)"/>
      <div class="exp-remain${remain<0?' neg':''}" id="er-${item.id}">${fw(remain)}</div>
    </div>`;
  } else {
    // unexpected expense row (draggable in expense mode)
    const dndAttrs=`draggable="true"
      ondragstart="onDragStart(event,${item.id},false)"
      ondragend="onDragEnd(event)"
      ondragover="onDragOver(event,${item.id},false)"
      ondragleave="clearDrop()"
      ondrop="onDrop(event,${item.id},false)"`;
    return `<div class="exp-row exp-item unexp-row" style="padding-left:${indent+2}px" ${dndAttrs}>
      <div class="item-num unexp">${idx}</div>
      <div class="exp-name"><span>${esc(item.purpose)}</span><span class="unexp-badge">예상외</span></div>
      <div class="exp-bamt" style="color:#9333ea">${fw(item.amount)}</div>
      <div class="exp-input" style="display:flex;align-items:center;justify-content:flex-end;font-size:.8rem;color:#9333ea;font-weight:600;">지출됨</div>
      <div style="display:flex;gap:3px;justify-content:flex-end">
        <button class="btn-ico del" onclick="deleteItem(${item.id},false)" title="삭제">${delIcon()}</button>
      </div>
    </div>`;
  }
}

// ═══════════════════════════════════════
//  EXCEL
// ═══════════════════════════════════════
function exportExcel(){
  const year=document.getElementById('yearSel').value, month=document.getElementById('monthSel').value;
  const wb=XLSX.utils.book_new();
  const co=getCarryover();

  // Sheet 1: 예산안
  const flat=flatBudget(null,0);
  const bData=[
    [`${year}년 ${month}월 예산안`],[],
    ['월급',salary],['이월',co],['사용 가능',salary+co],
    ['총 예산 지출',budgetTotal()],['예산 잔액',salary+co-budgetTotal()],[],
    ['번호','예산 목적','레벨','금액(원)','하위여부'],
    ...flat.map(({item,depth},i)=>{
      const hasKids=budgetItems.some(c=>c.parentId===item.id);
      return [i+1,' '.repeat(depth*2)+item.purpose,depth+1+'단계',item.amount,hasKids?`하위합계:${fw(childrenAmtSum(item.id))}`:''];
    }),
    [],['','합계','',budgetTotal(),''],
  ];
  const ws1=XLSX.utils.aoa_to_sheet(bData);
  ws1['!cols']=[{wch:6},{wch:26},{wch:8},{wch:14}];
  ws1['!merges']=[{s:{r:0,c:0},e:{r:0,c:3}}];
  XLSX.utils.book_append_sheet(wb,ws1,'예산안');

  // Sheet 2: 지출내역
  const tA=actualTotal(), tU=unexpTotal(), finalR=salary+co-tA-tU;
  const rows=buildExpenseRows(null,0);
  const eData=[
    [`${year}년 ${month}월 지출 내역`],[],
    ['사용 가능(월급+이월)',salary+co],['실제 지출',tA],['예상외 지출',tU],['최종 잔액',finalR],[],
    ['번호','항목','레벨','예산','실제 지출','잔액'],
    ...rows.map(({type,item,depth},i)=>{
      if(type==='budget'){
        const act=expenseAmounts[item.id]||0;
        return [i+1,' '.repeat(depth*2)+item.purpose,depth+1+'단계',item.amount,act,item.amount-act];
      } else {
        return [i+1,' '.repeat(depth*2)+'[예상외]'+item.purpose,'—','—',item.amount,'—'];
      }
    }),
  ];
  const ws2=XLSX.utils.aoa_to_sheet(eData);
  ws2['!cols']=[{wch:6},{wch:26},{wch:8},{wch:12},{wch:12},{wch:12}];
  ws2['!merges']=[{s:{r:0,c:0},e:{r:0,c:5}}];
  XLSX.utils.book_append_sheet(wb,ws2,'지출내역');

  const fn=`예산관리_${year}년_${month}월.xlsx`;
  XLSX.writeFile(wb,fn); toast(`"${fn}" 저장 완료`);
}

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function fw(n){ const a=Math.abs(Math.round(n)); return (n<0?'-':'')+'₩'+a.toLocaleString('ko-KR'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function emptyHtml(msg){ return `<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>${msg}</div>`; }
function dragIcon(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="7" r="1.5"/><circle cx="15" cy="7" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="17" r="1.5"/><circle cx="15" cy="17" r="1.5"/></svg>`; }
function editIcon(){ return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`; }
function delIcon(){ return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`; }

let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2500); }
</script>
